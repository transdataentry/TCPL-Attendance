  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 16px; border-radius:10px; border:1.5px solid var(--tcpl-border); background:var(--tcpl-white); color:var(--tcpl-ink); font-size:14px; font-weight:500; cursor:pointer; transition:all .12s ease; }
  .btn:hover { background:var(--tcpl-blue-light); border-color:var(--tcpl-blue); }
  .btn:active { transform:scale(0.98); }
  .btn-primary { background:var(--tcpl-orange); color:#fff; border:1.5px solid var(--tcpl-orange); box-shadow:0 2px 6px rgba(249,115,22,0.30); }
  .btn-primary:hover { background:var(--tcpl-orange-dark); border-color:var(--tcpl-orange-dark); }
  .btn-danger { background:var(--tcpl-red-light); color:var(--tcpl-red); border:1.5px solid #F3B9B9; }
  .btn-success { background:var(--tcpl-green-light); color:var(--tcpl-green); border:1.5px solid #A9E0BB; }
  .field { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .field label { font-size:13px; color:var(--tcpl-muted); font-weight:500; }
  .field input, .field select, .field textarea { height:38px; padding:0 10px; border-radius:9px; border:1.5px solid var(--tcpl-border); background:var(--tcpl-white); color:var(--tcpl-ink); font-size:14px; }

  .badge { display:inline-block; font-size:12px; padding:3px 10px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .badge-pending { background:var(--tcpl-orange-light); color:var(--tcpl-orange-dark); }
  .badge-dispatched { background:var(--tcpl-green-light); color:var(--tcpl-green); }
  .badge-diverted { background:var(--tcpl-blue-light); color:var(--tcpl-blue-dark); }
  .tab-bar { display:flex; gap:8px; margin-bottom:1rem; flex-wrap:wrap; }

function loadScriptOnce(src){
  return new Promise(function(resolve, reject){

}

  return typeof firebase !== 'undefined';
}

// Save data to Firebase Firestore
function saveToFirebase(collection, docId, data){
  if(!FIREBASE_READY || !firebase.firestore){
    console.error('Firebase not ready');
    return;
  }
  
  var db = firebase.firestore();
  db.collection(collection).doc(docId).set(data, { merge: true })
    .then(function(){
      console.log('✅ Saved to Firebase:', collection, docId);
    })
    .catch(function(error){
      console.error('❌ Error saving to Firebase:', error);
      alert('❌ Error saving! '+error.message);
    });
}

async function initFirebase(){
  if (!FIREBASE_READY) return;
  var ok = await ensureFirebaseSdkLoaded();
  if (!ok){
    console.error('Firebase SDK never loaded (checked window.firebase after retry).');
    FIREBASE_SDK_FAILED = true;
    FIREBASE_READY = false;
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch(e) { console.error('Firebase init failed', e); FIREBASE_READY = false; }
}

async function loadAll(){
  await initFirebase();
  if (!FIREBASE_READY) {
    STATE.loading = false;
    if (FIREBASE_SDK_FAILED) STATE.firebaseSdkFailed = true;
    else STATE.firebaseNotConfigured = true;
    render();
    return;
  }
  try {
    var configDoc = await db.collection('config').doc('main').get();
    if (configDoc.exists) {
      var cfg = configDoc.data();
      STATE.plants = cfg.plants || SEED_PLANTS.slice();
      STATE.marketPersons = cfg.marketPersons || SEED_MARKET_PERSONS.slice();
      STATE.adminPin = cfg.adminPin || 'admin123';
      STATE.pumpPin = cfg.pumpPin || 'pump123';
      STATE.users = cfg.users || SEED_USERS.slice();
      STATE.roles = cfg.roles || SEED_ROLES.slice();
      STATE.trucks = cfg.trucks || SEED_TRUCKS.slice();
      STATE.drivers = cfg.drivers || SEED_DRIVERS.slice();
      STATE.helpers = cfg.helpers || SEED_HELPERS.slice();
    } else {
      STATE.plants = SEED_PLANTS.slice();
      STATE.marketPersons = SEED_MARKET_PERSONS.slice();
      STATE.adminPin = 'admin123';
      STATE.pumpPin = 'pump123';
      STATE.users = SEED_USERS.slice();
      STATE.roles = SEED_ROLES.slice();
      STATE.trucks = SEED_TRUCKS.slice();
      STATE.drivers = SEED_DRIVERS.slice();
      STATE.helpers = SEED_HELPERS.slice();
      await db.collection('config').doc('main').set({
        plants: STATE.plants, marketPersons: STATE.marketPersons,
        adminPin: STATE.adminPin, pumpPin: STATE.pumpPin, users: STATE.users,
        roles: STATE.roles, trucks: STATE.trucks, drivers: STATE.drivers, helpers: STATE.helpers
      });
    }

    var sitesSnap = await db.collection('sites').get();
    if (sitesSnap.empty) {
      var batch = db.batch();
      SEED_SITES.forEach(function(s){ batch.set(db.collection('sites').doc(s.id), s); });
      await batch.commit();
      STATE.sites = SEED_SITES.slice();
    } else {
      STATE.sites = sitesSnap.docs.map(function(d){ return d.data(); });
    }

    var ordersSnap = await db.collection('orders').get();
    STATE.orders = ordersSnap.docs.map(function(d){ return d.data(); });

    // Real-time listeners: whenever ANY user (any device, anywhere) changes orders/sites/
    // config, Firestore pushes the update here automatically -- no refresh needed. We skip
    // re-rendering while someone is mid-typing a form or has a modal open, so we don't wipe
    // their in-progress input out from under them.
    db.collection('orders').onSnapshot(function(snap){
      STATE.orders = snap.docs.map(function(d){ return d.data(); });
      if(safeToAutoRerender()) render();
    });
    db.collection('sites').onSnapshot(function(snap){
      STATE.sites = snap.docs.map(function(d){ return d.data(); });
      if(safeToAutoRerender()) render();
    });
    db.collection('config').doc('main').onSnapshot(function(doc){
      if(doc.exists){
        var c = doc.data();
        STATE.plants = c.plants || STATE.plants;
        STATE.marketPersons = c.marketPersons || STATE.marketPersons;
        STATE.adminPin = c.adminPin || STATE.adminPin;
        STATE.pumpPin = c.pumpPin || STATE.pumpPin;
        STATE.users = c.users || STATE.users;
        if(safeToAutoRerender()) render();
      }
    });

    // Load new collections: Loading Instructions, Invoices, Gate Logs, Trip Reports
    var liSnap = await db.collection('loadingInstructions').get();
    STATE.loadingInstructions = liSnap.docs.map(function(d){ return d.data(); });
    db.collection('loadingInstructions').onSnapshot(function(snap){
      STATE.loadingInstructions = snap.docs.map(function(d){ return d.data(); });
      if(safeToAutoRerender()) render();
    });

    var invSnap = await db.collection('invoices').get();
    STATE.invoices = invSnap.docs.map(function(d){ return d.data(); });
    db.collection('invoices').onSnapshot(function(snap){
      STATE.invoices = snap.docs.map(function(d){ return d.data(); });
      if(safeToAutoRerender()) render();
    });

    var glSnap = await db.collection('gateLogs').get();
    STATE.gateLogs = glSnap.docs.map(function(d){ return d.data(); });
    db.collection('gateLogs').onSnapshot(function(snap){
      STATE.gateLogs = snap.docs.map(function(d){ return d.data(); });
      if(safeToAutoRerender()) render();
    });

    var trSnap = await db.collection('tripReports').get();
    STATE.tripReports = trSnap.docs.map(function(d){ return d.data(); });
    db.collection('tripReports').onSnapshot(function(snap){
      STATE.tripReports = snap.docs.map(function(d){ return d.data(); });
      if(safeToAutoRerender()) render();
    });

  } catch(e) {
    console.error('Firestore load error', e);
    STATE.loadError = e.message;
  }
  STATE.loading = false;
  render();
}

function safeToAutoRerender(){
  if(STATE.loading) return false;
  if(STATE.modal) return false; // someone has a form/modal open -- don't yank it away
  if(STATE.view==='market' && STATE.marketTab==='new') return false; // mid-typing new order
  return true;
}

  await db.collection('orders').doc(order.id).set(order, { merge: true });

function nearestPlant(site){
  if(!site || !site.distances) return {plant:'', km:null};
  var best=null, bestKm=Infinity;
  STATE.plants.forEach(function(pl){
    var km = site.distances[pl];
    if(km!==undefined && km!==null && km!=='' && Number(km) < bestKm){ bestKm = Number(km); best = pl; }
  });
  return {plant: best||'', km: best? bestKm : null};
}

// Helper function: Get distances from Site Master
function getDistancesFromMaster(siteId){
  var site = STATE.sites.find(function(s){return s.id===siteId;});
  if(!site || !site.distances) return {jalan: '-', rajarhat: '-', taratala: '-', nearest: '-'};
  
  var jalan = (site.distances && site.distances['Jalan']) ? site.distances['Jalan'] : '-';
  var rajarhat = (site.distances && site.distances['Rajarhat']) ? site.distances['Rajarhat'] : '-';
  var taratala = (site.distances && site.distances['Taratala']) ? site.distances['Taratala'] : '-';
  var np = nearestPlant(site);
  
  return {
    jalan: jalan,
    rajarhat: rajarhat,
    taratala: taratala,
    nearest: np.plant || '-'
  };
}

// ✅ Show success message (replaces alert)
function showSuccessMessage(msg, duration){
  duration = duration || 3000; // 3 seconds default
  var el = document.getElementById('successMessage');
  if(!el) return;
  
  el.textContent = msg;
  el.style.display = 'block';
  el.classList.remove('hide');
  
  // Auto-hide after duration
  setTimeout(function(){
    el.classList.add('hide');
    setTimeout(function(){
      el.style.display = 'none';
    }, 300);
  }, duration);
}

// ✅ Show error message (also custom)
function showErrorMessage(msg, duration){
  duration = duration || 3000;
  var el = document.getElementById('successMessage');
  if(!el) return;
  
  el.textContent = msg;
  el.style.background = 'var(--tcpl-red)';
  el.style.display = 'block';
  el.classList.remove('hide');
  
  setTimeout(function(){
    el.classList.add('hide');
    setTimeout(function(){
      el.style.display = 'none';
      el.style.background = 'var(--tcpl-green)'; // Reset color
    }, 300);
  }, duration);
}

function render(){
  setDefaultDates();  // Set dates to today if not already set
  
  // ✅ Apply theme from localStorage
  var savedTheme = localStorage.getItem('tcpl-theme') || 'light';
  STATE.theme = savedTheme;
  if(savedTheme === 'dark'){
    document.body.classList.add('dark-theme');
  } else {
    document.body.classList.remove('dark-theme');
  }
  
  var app = document.getElementById('app');
  if(STATE.loading){ app.innerHTML = '<div style="text-align:center;padding:3rem 0;color:var(--tcpl-muted)">Loading...</div>'; return; }
  if(STATE.firebaseNotConfigured){ renderFirebaseSetupScreen(app); return; }
  if(STATE.firebaseSdkFailed){ renderFirebaseSdkFailedScreen(app); return; }
  if(STATE.loadError){ renderFirebaseErrorScreen(app); return; }
  if(STATE.view==='landing') renderLanding(app);
  else if(STATE.view==='market') renderMarket(app);
  else if(STATE.view==='dispatch') renderDispatch(app);
  else if(STATE.view==='admin') renderAdmin(app);
  else if(STATE.view==='pubdashboard') { renderPublicDashboard(app); wireDashboardDatePicker(); }
  else if(STATE.view==='pump') renderPumpManager(app);
  else if(STATE.view==='plantsheet') renderPlantSheetView(app);
  else if(STATE.view==='mpsheet') renderMpSheetView(app);
  else if(STATE.view==='operator') renderOperator(app);
  else if(STATE.view==='security') renderSecurity(app);
  if(STATE.modal) app.insertAdjacentHTML('beforeend', modalHtml());
}

appAction.loginUser = function(){
  var username = document.getElementById('ln-user').value.trim();
  var pass = document.getElementById('ln-pass').value;
  if(!username){ alert('Enter your username.'); return; }

  // Master admin break-glass login: username "admin" + master PIN, always works
  // even if the Users list is empty or broken.
  if(username.toLowerCase()==='admin' && pass===STATE.adminPin){
    STATE.user = { role:'admin', isSuper:true, username:'master', allowedTabs: ADMIN_TAB_KEYS.slice() };
    STATE.adminTab = 'dashboard';
    go('admin');
    return;
  }

  var u = STATE.users.find(function(x){return x.username===username;});
  if(!u || u.password !== pass){ alert('Wrong username or password. Ask your admin if you\u2019re not sure.'); return; }

  if(u.role==='market'){
    STATE.user = { role:'market', name: u.marketPersonName || u.username };
    go('market');
  } else if(u.role==='dispatch'){
    STATE.user = { role:'dispatch', plant: u.plant };
    STATE.dispatchTab = 'pending';
    go('dispatch');
  } else if(u.role==='pump'){
    STATE.user = { role:'pump' };
    go('pump');
  } else if(u.role==='operator'){
    STATE.user = { role:'operator', plant: u.plant, name: u.operatorName || u.username };
    STATE.operatorTab = 'pending';
    go('operator');
  } else if(u.role==='security'){
    STATE.user = { role:'security', plant: u.plant, name: u.securityName || u.username };
    STATE.gateTab = 'out';
    go('security');
  } else if(u.role==='admin'){
    STATE.user = { role:'admin', isSuper:false, username:u.username, allowedTabs:(u.allowedTabs||['dashboard']).slice() };
    STATE.adminTab = (u.allowedTabs && u.allowedTabs[0]) || 'dashboard';
    go('admin');
  } else {
    alert('This user has no role assigned yet. Ask your admin to fix it in Users / access.');
  }
};

appAction.cancelPendingOrder = function(orderId){
  if(!confirm('Are you sure you want to CANCEL this order?')) return;
  var order = STATE.orders.find(function(o){return o.id===orderId;});
  if(!order) return;
  order.cancelled = true;
  order.cancelledBy = STATE.user.name;
  order.cancelledAt = new Date().toISOString();
  saveOrder(order).then(function(){
    showSuccessMessage('✅ Order cancelled successfully!', 2000);
    render();
  }).catch(function(err){
    showErrorMessage('❌ Error cancelling order: ' + err.message, 2000);
  });
};

appAction.editPendingOrder = function(orderId){
  var order = STATE.orders.find(function(o){return o.id===orderId;});
  if(!order) return;
  if(order.dispatchStatus==='Y'){ alert('Cannot modify fully dispatched order'); return; }

  document.getElementById('of-grade').value = order.grade;

  document.getElementById('of-slump').value = order.slump || '';
  document.getElementById('of-pump').value = order.pumpReq;
  document.getElementById('of-date').value = order.dateReq;
  document.getElementById('of-time').value = order.timeAtSite;
  document.getElementById('of-remarks').value = order.remarks || '';
  // Store order ID for update
  window.editingOrderId = orderId;
  STATE.marketTab='new';
  render();
  // Show message
  alert('Order opened for modification. Update and submit to save changes.');
};

appAction.onSiteChange = function(){
  var sel = document.getElementById('of-site');
  var newBox = document.getElementById('of-newsite');
  var info = document.getElementById('of-siteinfo');
  var plantSel = document.getElementById('of-plantselect');
  if(!sel) return;
  if(sel.value==='__new__'){ newBox.style.display='block'; info.style.display='none'; plantSel.style.display='none'; return; }
  newBox.style.display='none';
  var site = STATE.sites.find(function(s){return s.id===sel.value;});
  if(site){
    var np = nearestPlant(site);
    
    // Check if ANY plant has KM entry in Site Master
    var hasAnyKM = false;
    STATE.plants.filter(function(p){return p;}).forEach(function(p){
      var pn = getPlantName(p);
      var km = site.distances && site.distances[pn];
      if(km !== undefined && km !== null && km !== '') hasAnyKM = true;
    });
    
    info.style.display='block';
    plantSel.style.display='block';
    
    // Show all plant distances in clear format
    var distInfo = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:6px">';
    STATE.plants.filter(function(p){return p;}).forEach(function(p){
      var pn = getPlantName(p);
      var km = site.distances && site.distances[pn];
      var isNearest = pn === np.plant && hasAnyKM;
      var bgColor = isNearest ? 'rgba(100,200,100,0.3)' : 'transparent';
      var fontWeight = isNearest ? '700' : '500';
      var color = isNearest ? 'var(--tcpl-green)' : '#666';
      distInfo += '<span style="background:'+bgColor+';padding:3px 6px;border-radius:3px;margin-right:8px;font-size:11px;font-weight:'+fontWeight+';color:'+color+'">' +
        esc(pn)+': '+(km!=null?km+'km':'-')+(isNearest?' ✓':'') +
      '</span>';
    });
    distInfo += '</div>';
    
    // Determine message based on available KM data
    var suggestedPlant = np.plant && hasAnyKM ? np.plant : 'Please select manually';
    var plantMsg = hasAnyKM ? ('✓ '+esc(suggestedPlant)) : ('⚠️ Choose plant manually');
    
    info.innerHTML = '<div style="padding:6px 0;line-height:1.3">' +
      '<div style="color:var(--tcpl-blue-dark);font-size:12px;font-weight:600">📍 '+esc(site.party)+'</div>' +
      '<div style="font-size:11px;opacity:0.8;margin-top:2px">'+plantMsg+' | '+esc(site.contactPerson)+' | '+esc(site.contactMobile)+'</div>' +
      '<div style="font-size:10px;opacity:0.7;margin-top:3px">' + distInfo + '</div>' +
    '</div>';
  } else { 
    info.style.display='none'; 
    plantSel.style.display='none';
  }
};

appAction.saveNewSite = function(){
  var name = document.getElementById('ns-name').value.trim();
  var party = document.getElementById('ns-party').value.trim();
  if(!name){ alert('Site name is required.'); return; }
  var distances = {};
  STATE.plants.filter(function(p){return p;}).forEach(function(p,i){
    var pn = getPlantName(p);
    var el = document.getElementById('ns-dist-'+i);
    if(el && el.value!=='') distances[pn] = Number(el.value);
  });
  
  // ✅ Allow site creation even if NO distances are entered
  // User will be prompted to manually select plant when creating order
  var site = { id:'SITE-'+Date.now().toString(36), name:name, party:party, distances:distances,
    contactPerson: document.getElementById('ns-cp').value.trim(), contactMobile: document.getElementById('ns-cm').value.trim() };
  STATE.sites.push(site);
  saveSite(site).then(function(){
    render();
    setTimeout(function(){
      var sel = document.getElementById('of-site');
      if(sel){ sel.value = site.id; appAction.onSiteChange(); }
    }, 50);
  });
};

appAction.submitOrder = function(){
  var siteId = document.getElementById('of-site').value;
  if(!siteId || siteId==='__new__'){ showErrorMessage('⚠️ Please select (or add) a site.', 2000); return; }
  var site = STATE.sites.find(function(s){return s.id===siteId;});
  var qty = document.getElementById('of-qty').value;
  if(!qty){ showErrorMessage('⚠️ Please enter quantity.', 2000); return; }
  
  // Check if ANY plant has KM entry in Site Master
  var hasAnyKM = false;
  STATE.plants.filter(function(p){return p;}).forEach(function(p){
    var pn = getPlantName(p);
    var km = site.distances && site.distances[pn];
    if(km !== undefined && km !== null && km !== '') hasAnyKM = true;
  });
  
  var np = nearestPlant(site);
  
  // Get selected plant (if different from nearest)
  var selectedPlant = document.getElementById('of-plant').value;
  var plantReason = document.getElementById('of-plant-reason').value.trim();
  
  // ✅ NEW LOGIC: If NO KM available, user MUST manually select a plant
  if(!hasAnyKM && (!selectedPlant || selectedPlant === '-- Auto --')){
    showErrorMessage('⚠️ No distance data. Please select a plant manually from dropdown.', 3000);
    return;
  }
  
  // Determine assigned plant
  var assignedPlant = selectedPlant && selectedPlant !== '-- Auto --' ? selectedPlant : (np.plant || '');
  var isDiverted = assignedPlant && np.plant && assignedPlant !== np.plant;
  
  // ✅ ALLOW order even if assignedPlant is empty (user can add plant manually later)
  // But warn them
  if(!assignedPlant){
    showErrorMessage('⚠️ No plant assigned. Order created but please assign plant before dispatching.', 3000);
  }
  
  // Get distances from site data - ensure no undefined values
  var distJalan = (site.distances && site.distances['Jalan'] !== undefined) ? site.distances['Jalan'] : null;
  var distRajarhat = (site.distances && site.distances['Rajarhat'] !== undefined) ? site.distances['Rajarhat'] : null;
  var distTaratala = (site.distances && site.distances['Taratala'] !== undefined) ? site.distances['Taratala'] : null;
  
  var isEditing = window.editingOrderId;
  var order;
  
  if(isEditing){
    // EDITING existing order
    order = STATE.orders.find(function(o){return o.id===window.editingOrderId;});
    if(!order) return;
    order.grade = document.getElementById('of-grade').value;
    order.qty = qty;
    order.slump = document.getElementById('of-slump').value;
    order.pumpReq = document.getElementById('of-pump').value;
    order.dateReq = document.getElementById('of-date').value;
    order.timeAtSite = document.getElementById('of-time').value;
    order.remarks = document.getElementById('of-remarks').value;
    order.modifiedBy = STATE.user.name;
    order.modifiedAt = new Date().toISOString();
  } else {
    // CREATE new order
    order = {
      id: genId(), datePosted: new Date().toISOString(), marketPerson: STATE.user.name,
      siteId: site.id, siteName: site.name, party: site.party, siteContact: site.contactPerson, siteMobile: site.contactMobile,
      grade: document.getElementById('of-grade').value, qty: qty, slump: document.getElementById('of-slump').value,
      pumpReq: document.getElementById('of-pump').value, dateReq: document.getElementById('of-date').value, timeAtSite: document.getElementById('of-time').value,
      nearestPlant: np.plant || '', distanceKm: np.km || null, 
      distJalan: distJalan !== undefined ? distJalan : null, 
      distRajarhat: distRajarhat !== undefined ? distRajarhat : null, 
      distTaratala: distTaratala !== undefined ? distTaratala : null,
      assignedPlant: assignedPlant, 
      originalPlant: np.plant || '',
      diverted: isDiverted, 
      divertedBy: isDiverted ? STATE.user.name : '', 
      divertedInstructionOf: isDiverted ? 'market-order-creation' : '', 
      divertedReason: isDiverted ? plantReason : '',
      divertedPlantAt: isDiverted ? assignedPlant : '',
      pumpOperatorName:'', pumpOperatorMobile:'',
      dispatchStatus:'N', dispatchDateTime:'', driverName:'', helperName:'', tmRegNo:'', tmContact:'',
      remarks: document.getElementById('of-remarks').value
    };
    STATE.orders.push(order);
  }
  
  saveOrder(order).then(function(){
    if(isEditing){
      showSuccessMessage('✅ ORDER MODIFIED! ID: ' + order.id, 3000);
      window.editingOrderId = null;
    } else {
      var partyName = order.party || 'Order';
      var qtyInfo = order.qty + ' CuM (' + order.grade + ')';
      showSuccessMessage('✅ ORDER SUBMITTED! | Party: ' + partyName + ' | Qty: ' + qtyInfo + ' | Order ID: ' + order.id, 4000);
    }
    setTimeout(function(){
      STATE.marketTab='mine';
      render();
    }, 500);
  }).catch(function(error){
    showErrorMessage('❌ Error saving order: ' + error.message, 3000);
  });
};

function statusBadge(o){
  if(o.dispatchStatus==='Y') return '<span class="badge badge-dispatched">✅ Fully Dispatched</span>';
  if(o.diverted) return '<span class="badge badge-diverted">⚠️ Diverted</span>';
  
  // Check dispatched vs total quantity
  var liForOrder = STATE.loadingInstructions.filter(function(li){return li.orderId===o.id;});
  var dispatchedQty = liForOrder.reduce(function(sum, li){return sum + parseFloat(li.quantity||0);}, 0);
  var totalQty = parseFloat(o.qty)||0;
  
  // If dispatched qty >= total qty, it's fully dispatched
  if(dispatchedQty >= totalQty && totalQty > 0){
    return '<span class="badge badge-dispatched">✅ Fully Dispatched</span>';
  }
  
  // If some dispatched, it's partial
  if(dispatchedQty > 0){
    return '<span class="badge badge-warning">🚚 Partially Dispatched</span>';
  }
  
  return '<span class="badge badge-pending">⏳ Pending</span>';
}

var PLANT_COLORS = [
  { bar:'var(--tcpl-blue)',   head:'var(--tcpl-blue-light)',   text:'var(--tcpl-blue-dark)' },
  { bar:'var(--tcpl-green)',  head:'var(--tcpl-green-light)',  text:'var(--tcpl-green)' },
  { bar:'#8B5CF6',            head:'#F1E9FE',                  text:'#6D28D9' },
  { bar:'var(--tcpl-orange)', head:'var(--tcpl-orange-light)', text:'var(--tcpl-orange-dark)' }
];
function plantColorFor(plantName){
  var idx = STATE.plants.indexOf(plantName);
  if(idx < 0) idx = 0;
  return PLANT_COLORS[idx % PLANT_COLORS.length];
}

function renderOrderTable(orders, opts){
  opts = opts || {};
  var sorted = orders.slice().sort(function(a,b){return (a.timeAtSite||'').localeCompare(b.timeAtSite||'');});
  var rows = sorted.map(function(o, i){
    // Calculate dispatched vs pending
    var liForOrder = STATE.loadingInstructions.filter(function(li){return li.orderId===o.id;});
    var dispatchedQty = liForOrder.reduce(function(sum, li){return sum + parseFloat(li.quantity||0);}, 0);
    var totalQty = parseFloat(o.qty)||0;
    var pendingQty = totalQty - dispatchedQty;
    
    var pumpCell = o.pumpReq==='Y' ? '💧 Yes' : '–';
    var opCell = o.pumpOperatorName ? esc(o.pumpOperatorName)+(o.pumpOperatorMobile?' ('+esc(o.pumpOperatorMobile)+')':'') : (o.pumpReq==='Y' ? '<span style="color:var(--tcpl-orange-dark)">not assigned</span>' : '–');
    var distCell = o.distanceKm!=null ? o.distanceKm+' km' : '–';
    
    // Get distances from Site Master (single source of truth)
    var masterDist = getDistancesFromMaster(o.siteId);
    
    // Show Qty with dispatched/pending split - COMPLETE FORMAT
    var qtyDisplay = '';
    if(opts.isDispatched){
      // DISPATCHED section: show total | dispatched | pending
      qtyDisplay = '<div style="font-size:13px;line-height:1.5">' +
        '<div style="font-weight:600">'+totalQty.toFixed(1)+' CuM</div>' +
        '<div style="font-size:12px;color:var(--tcpl-green)">'+dispatchedQty.toFixed(1)+' dispatched</div>' +
        (pendingQty > 0 ? '<div style="font-size:12px;color:var(--tcpl-orange-dark)">'+pendingQty.toFixed(1)+' pending</div>' : '') +
      '</div>';
    } else {
      // PENDING section: show total | dispatched | pending
      qtyDisplay = '<div style="font-size:13px;line-height:1.5">' +
        '<div style="font-weight:600">'+totalQty.toFixed(1)+' CuM</div>' +
        (dispatchedQty > 0 ? '<div style="font-size:12px;color:var(--tcpl-green)">'+dispatchedQty.toFixed(1)+' dispatched</div>' : '') +
        (pendingQty > 0 ? '<div style="font-size:12px;color:var(--tcpl-orange-dark)">'+pendingQty.toFixed(1)+' pending</div>' : '<div style="font-size:12px;color:var(--tcpl-muted)">— pending</div>') +
      '</div>';
    }
    
    var actionsCell = '';
    if(opts.showActions && o.dispatchStatus!=='Y'){
      if(opts.isDispatched){
        // DISPATCHED section: Check if all TM details are filled
        var confirmedCount = liForOrder.filter(function(li){return li.status==='confirmed';}).length;
        var allTMDetailsFilled = liForOrder.length > 0 && liForOrder.every(function(li){
          return li.status==='confirmed' && li.tmNumber && li.driverName && li.helperName;
        });
        
        if(allTMDetailsFilled){
          // All TM details saved - show status, no button
          actionsCell = '<td style="white-space:nowrap;color:var(--tcpl-green);font-weight:600">✅ Invoices Created</td>';
        } else {
          // Not all saved - show button to create
          actionsCell = '<td style="white-space:nowrap"><button class="btn btn-primary" style="padding:5px 10px;font-size:12px" onclick="appAction.openTMDetailsModal(\''+o.id+'\')">📋 Create Invoices</button></td>';
        }
      } else {
        // PENDING section: show Loading Instruction + TM Details (when all confirmed)
        var allConfirmed = liForOrder.length > 0 && liForOrder.every(function(li){return li.status==='confirmed';});
        var anyConfirmed = liForOrder.length > 0 && liForOrder.some(function(li){return li.status==='confirmed';});
        var pendingLIs = liForOrder.filter(function(li){return li.status!=='confirmed';});
        var hasPendingLI = pendingLIs.length > 0;
        var nextLINumber = liForOrder.length + 1;
        var nextLILabel = 'L' + nextLINumber;
        
        if(allConfirmed && pendingQty <= 0){
          // All quantity confirmed - show TM Details button
          var confirmedCount = liForOrder.length;
          var lastLINumber = confirmedCount;
          actionsCell = '<td style="white-space:nowrap"><button class="btn btn-primary" style="padding:5px 10px;font-size:12px" onclick="appAction.openTMDetailsModal(\''+o.id+'\')">🚚 L'+lastLINumber+' TM Details</button></td>';
        } else if(anyConfirmed && pendingQty > 0){
          // Partially dispatched - show next loading instruction button (if last one is confirmed)
          var confirmed = liForOrder.filter(function(li){return li.status==='confirmed';}).length;
          var lastLI = liForOrder[liForOrder.length - 1];
          if(lastLI && lastLI.status !== 'confirmed'){
            // Last LI is pending - can't create next one
            actionsCell = '<td style="white-space:nowrap"><button class="btn" style="padding:5px 10px;font-size:12px;opacity:0.5;cursor:not-allowed" disabled>📋 '+nextLILabel+' (Waiting...)</button> ' +
              '<span style="font-size:11px;color:var(--tcpl-orange-dark)">⏳ '+confirmed+'/'+liForOrder.length+' confirmed</span></td>';
          } else {
            // Last LI confirmed - can create next one
            actionsCell = '<td style="white-space:nowrap"><button class="btn btn-warning" style="padding:5px 10px;font-size:12px" onclick="appAction.openDispatchModal(\''+o.id+'\')">📋 '+nextLILabel+' Loading Instruction</button> ' +
              '<span style="font-size:11px;color:var(--tcpl-blue-dark)">✅ '+confirmed+'/'+liForOrder.length+' confirmed</span></td>';
          }
        } else if(liForOrder.length > 0){
          // Some exist but not all confirmed
          var confirmed = liForOrder.filter(function(li){return li.status==='confirmed';}).length;
          var lastLI = liForOrder[liForOrder.length - 1];
          if(lastLI && lastLI.status !== 'confirmed'){
            // Waiting for first LI confirmation
            actionsCell = '<td style="font-size:12px;color:var(--tcpl-orange-dark)">⏳ Waiting for L'+(confirmed+1)+' confirmation from operator</td>';
          } else {
            actionsCell = '<td style="font-size:12px;color:var(--tcpl-blue-dark)">⏳ '+confirmed+'/'+liForOrder.length+' confirmed</td>';
          }
        } else {
          // No loading instructions yet
          actionsCell = '<td style="white-space:nowrap"><button class="btn btn-success" style="padding:5px 10px;font-size:12px" onclick="appAction.openDispatchModal(\''+o.id+'\')">📋 L1 Loading Instruction</button></td>';
        }
      }
    } else if(opts.showActions){
      actionsCell = '<td style="font-size:12px;color:var(--tcpl-muted)">✅ Fully Dispatched</td>';
    }
    return '<tr>' +
      '<td>'+(i+1)+'</td>' +
      '<td style="text-align:left">'+siteAndParty(o)+(o.diverted?'<br><span style="font-size:11px;color:var(--tcpl-orange-dark);font-weight:500">⚠️ Diverted from '+esc(o.originalPlant)+' by '+esc(o.divertedBy)+'</span>'+(o.divertedReason?'<br><span style="font-size:10px;color:var(--tcpl-orange-dark)">Reason: '+esc(o.divertedReason)+'</span>':''):'')+(o.partialSplitNote?'<br><span style="font-size:11px;color:var(--tcpl-blue-dark)">\u2702\uFE0F '+esc(o.partialSplitNote)+'</span>':'')+'</td>' +
      '<td>'+esc(o.grade)+'</td>' +
      '<td>'+qtyDisplay+'</td>' +
      '<td>'+esc(o.timeAtSite)+'</td>' +
      '<td>'+pumpCell+'</td>' +
      '<td>'+opCell+'</td>' +
      '<td>'+distCell+'</td>' +
      '<td style="font-size:12px">'+esc(o.marketPerson || '-')+'</td>' +
      (opts.showPlantDistance ? '<td style="font-size:12px;font-weight:600">'+masterDist.jalan+'</td>' : '') +
      (opts.showPlantDistance ? '<td style="font-size:12px;font-weight:600">'+masterDist.rajarhat+'</td>' : '') +
      (opts.showPlantDistance ? '<td style="font-size:12px;font-weight:600">'+masterDist.taratala+'</td>' : '') +
      (opts.showPlantDistance ? '<td style="font-size:12px"><span class="badge" style="background:'+(masterDist.nearest==='Jalan'?'var(--tcpl-blue)':masterDist.nearest==='Rajarhat'?'var(--tcpl-green)':'var(--tcpl-orange)')+'">'+esc(masterDist.nearest)+'</span></td>' : '') +
      (opts.showPlantDistance ? '<td style="font-size:11px;text-align:left">'+esc(o.remarks || '-')+'</td>' : '') +
      (opts.showStatus ? '<td>'+statusBadge(o)+'</td>' : '') +
      actionsCell +
    '</tr>';
  }).join('');
  var headers = ['#','Party','Grade','Qty (D/P)','Time','Pump','Operator','Distance','Market Person'];
  if(opts.showPlantDistance) headers.push('Jalan (km)','Rajarhat (km)','Taratala (km)','Nearest plant','Remarks');
  if(opts.showStatus) headers.push('Status');
  if(opts.showActions) headers.push('Action / Invoke');
  return '<div style="overflow-x:auto"><table class="log" style="font-size:13px">' +
    '<thead><tr>'+headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead>' +
    '<tbody>'+(rows || '<tr><td colspan="'+headers.length+'" style="text-align:center;color:var(--tcpl-muted)">No deliveries.</td></tr>')+'</tbody>' +
  '</table></div>';
}

function renderPlantGroupCard(plantName, dateLabel, orders, opts){
  var c = plantColorFor(plantName);
  var totalQty = orders.reduce(function(s,o){return s + (parseFloat(o.qty)||0);}, 0);
  
  // Calculate total dispatched and pending
  var totalDispatched = 0;
  orders.forEach(function(o){
    var liForOrder = STATE.loadingInstructions.filter(function(li){return li.orderId===o.id;});
    totalDispatched += liForOrder.reduce(function(sum, li){return sum + parseFloat(li.quantity||0);}, 0);
  });
  var totalPending = totalQty - totalDispatched;
  
  var clickable = opts && opts.clickable;

function renderDispatch(app){
  var plant = STATE.user.plant;
  var mine = STATE.orders.filter(function(o){return o.assignedPlant===plant;});
  
  // Apply date filtering if dates are selected
  if(STATE.dispatchDateFrom || STATE.dispatchDateTo){
    mine = mine.filter(function(o){
      var orderDate = o.dateReq || o.createdAt;
      if(!orderDate) return true;
      var oDate = new Date(orderDate).toISOString().split('T')[0];
      if(STATE.dispatchDateFrom && oDate < STATE.dispatchDateFrom) return false;
      if(STATE.dispatchDateTo && oDate > STATE.dispatchDateTo) return false;
      return true;
    });
  }
  
  var dispatched = [];  // Orders with ANY confirmed LIs (even partial dispatch)
  var pending = [];     // Orders with remaining quantity to dispatch
  
  mine.forEach(function(o){
    var liForOrder = STATE.loadingInstructions.filter(function(li){return li.orderId===o.id;});
    var confirmedLIs = liForOrder.filter(function(li){return li.status==='confirmed';});
    var totalQty = parseFloat(o.qty)||0;
    var dispatchedQty = confirmedLIs.reduce(function(sum, li){return sum + parseFloat(li.quantity||0);}, 0);
    var remainingQty = totalQty - dispatchedQty;
    
    console.log('Order:', o.siteName, '| Total:', totalQty, '| ConfirmedLIs:', confirmedLIs.length, '| Dispatched:', dispatchedQty, '| Remaining:', remainingQty);
    
    // DISPATCHED: ANY orders with confirmed LIs (even partial like 19/30)
    if(confirmedLIs.length > 0){
      console.log('→ Adding to DISPATCHED:', o.siteName);
      dispatched.push(o);
    }
    
    // PENDING: Only if there's remaining qty to dispatch
    if(remainingQty > 0){
      console.log('→ Adding to PENDING:', o.siteName, '(remaining:', remainingQty+')');
      pending.push(o);
    }
  });
  
  var html = headerBar(plant+' dispatch', 'Dispatch person view');
  
  // Add date filter section
  html += '<div class="card" style="margin-bottom:1.2rem">' +
    '<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">' +
      '<div class="field" style="flex:1;min-width:160px">' +
        '<label style="font-weight:600;font-size:13px">From Date</label>' +
        '<input type="date" id="dispatch-from-date" value="'+(STATE.dispatchDateFrom||'')+'" style="width:100%;padding:8px;border:1px solid var(--tcpl-border);border-radius:6px;font-size:13px" onchange="appAction.setDispatchDateFrom(this.value)">' +
      '</div>' +
      '<div class="field" style="flex:1;min-width:160px">' +
        '<label style="font-weight:600;font-size:13px">To Date</label>' +
        '<input type="date" id="dispatch-to-date" value="'+(STATE.dispatchDateTo||'')+'" style="width:100%;padding:8px;border:1px solid var(--tcpl-border);border-radius:6px;font-size:13px" onchange="appAction.setDispatchDateTo(this.value)">' +
      '</div>' +
      '<button class="btn" style="padding:8px 12px;font-size:12px" onclick="appAction.clearDispatchDates()">🔄 Clear</button>' +
    '</div>' +
  '</div>';
  
  html += renderPlantGroupCard(plant, 'Dispatched ('+dispatched.length+')', dispatched, { showActions:true, isDispatched:true });
  html += renderPlantGroupCard(plant, 'Pending ('+pending.length+')', pending, { showActions:true, isDispatched:false });
  app.innerHTML = html;
}

appAction.saveTMDetails = function(liId){
  var tmNo = (document.getElementById('tm-'+liId) ? document.getElementById('tm-'+liId).value : '').trim();
  var driverName = (document.getElementById('driver-'+liId) ? document.getElementById('driver-'+liId).value : '').trim();
  var helperName = (document.getElementById('helper-'+liId) ? document.getElementById('helper-'+liId).value : '').trim();
  
  // Validate: all fields required
  if(!tmNo || !driverName || !helperName){
    alert('⚠️ Warning: Please fill all fields\n\n• TM Number\n• Driver Name\n• Helper Name');
    return;
  }
  
  var li = STATE.loadingInstructions.find(function(x){return x.id===liId;});
  if(!li){
    alert('❌ Loading instruction not found');
    return;
  }
  
  // Find which L number this is
  var allLIsForOrder = STATE.loadingInstructions.filter(function(x){return x.orderId===li.orderId && x.status==='confirmed';});
  var liIndex = allLIsForOrder.findIndex(function(x){return x.id===liId;});
  var liNumber = liIndex >= 0 ? liIndex + 1 : '?';
  
  li.tmNumber = tmNo;
  li.driverName = driverName;
  li.helperName = helperName;
  
  console.log('💾 Saving TM Details for L'+liNumber+':', liId, {tmNo, driverName, helperName});
  saveToFirebase('loadingInstructions', liId, li);
  
  // Create invoice for this loading instruction
  var invoiceId = 'INV-'+Date.now()+'-'+liId.substring(0,5);
  var invoice = {
    id: invoiceId,
    orderId: li.orderId,
    liId: liId,
    tmNo: tmNo,
    driverName: driverName,
    helperName: helperName,
    party: li.party || '',
    siteName: li.siteName || '',
    quantity: li.quantity,
    grade: li.grade || '',
    createdAt: new Date().toISOString()
  };
  
  // Check if invoice already exists for this LI
  var existingInvoice = STATE.invoices.find(function(inv){return inv.liId === liId;});
  if(!existingInvoice){
    STATE.invoices.push(invoice);
    saveToFirebase('invoices', invoiceId, invoice);
  }
  
  alert('✅ Invoice L'+liNumber+' Created!\n\n📦 Ready for Security Gate\n\nTM: '+tmNo+'\nDriver: '+driverName+'\nHelper: '+helperName);
  render();
};

appAction.addLoadingInstruction = function(orderId){
  var o = STATE.orders.find(function(x){return x.id===orderId;});
  if(!o) return;
  
  var qtyInput = document.getElementById('md-qty');
  var densityInput = document.getElementById('md-density');
  var slumpInput = document.getElementById('md-slump');
  
  if(!qtyInput || !qtyInput.value){
    alert('Enter quantity');
    return;
  }
  
  var qty = parseFloat(qtyInput.value);
  if(isNaN(qty) || qty <= 0){
    alert('Invalid quantity');
    return;
  }
  
  var density = densityInput && densityInput.value ? parseFloat(densityInput.value) : null;
  var slump = slumpInput && slumpInput.value ? parseFloat(slumpInput.value) : null;
  
  // Calculate remaining
  var existingLIs = STATE.loadingInstructions.filter(function(li){return li.orderId===orderId;});
  var dispatchedQty = existingLIs.reduce(function(sum, li){return sum + parseFloat(li.quantity||0);}, 0);
  var remainingQty = parseFloat(o.qty) - dispatchedQty;
  
  if(qty > remainingQty + 0.01){
    alert('Quantity exceeds remaining: '+remainingQty.toFixed(2)+' CuM');
    return;
  }
  
  // Create this LI
  var li = {
    id: 'LI-'+Date.now(),
    orderId: orderId,
    party: o.party,
    siteName: o.siteName,
    quantity: qty,
    grade: o.grade,
    status: 'pending',
    plant: o.assignedPlant,
    createdAt: new Date().toISOString(),
    density: density,
    slump: slump
  };
  
  STATE.loadingInstructions.push(li);
  saveLoadingInstruction(li);
  
  // Render modal again to update state
  render();
  scrollToModal();
};

appAction.createLoadingInstructions = function(orderId){
  var o = STATE.orders.find(function(x){return x.id===orderId;});
  if(!o) return;
  var input = document.getElementById('md-splits').value.trim();
  if(!input){ alert('Enter quantities'); return; }
  var splits = input.split(',').map(function(s){ return parseFloat(s.trim()); }).filter(function(x){ return !isNaN(x) && x > 0; });
  if(splits.length === 0){ alert('Invalid quantities'); return; }
  var total = splits.reduce(function(a,b){return a+b;}, 0);
  if(Math.abs(total - parseFloat(o.qty)) > 0.01){ alert('Total must equal '+o.qty+' CuM, got '+total); return; }
  
  splits.forEach(function(qty, idx){
    var li = {
      id: 'LI-'+Date.now()+'-'+idx,
      orderId: orderId,
      party: o.siteName,
      quantity: qty,
      grade: o.grade,
      status: 'pending',
      plant: o.assignedPlant
    };
    STATE.loadingInstructions.push(li);
    saveLoadingInstruction(li);
  });
  
  o.fullyDispatched = true;
  saveOrder(o).then(function(){
    appAction.closeModals();
    render();
  });
};

appAction.completeDispatchWithLI = function(orderId){
  var o = STATE.orders.find(function(x){return x.id===orderId;});
  if(!o) return;
  var tm = document.getElementById('cmdri-tm').value.trim();
  var driver = document.getElementById('cmdri-driver').value.trim();
  var helper = document.getElementById('cmdri-helper').value.trim();
  if(!tm || !driver){ alert('TM Reg No and Driver Name are required'); return; }
  
  var liList = STATE.loadingInstructions.filter(function(li){return li.orderId===orderId;});
  var invoicesToSave = [];
  
  liList.forEach(function(li){
    if(li.status === 'confirmed'){
      var invoice = {
        id: 'INV-'+Date.now()+'-'+Math.random().toString(36).substr(2,9),
        orderId: orderId,
        liId: li.id,
        party: li.party,
        quantity: li.quantity,
        grade: li.grade,
        batchNo: li.batchNo,
        density: li.density,
        tmNo: tm,
        driverName: driver,
        helperName: helper,
        status: 'created'
      };
      STATE.invoices.push(invoice);
      invoicesToSave.push(invoice);
    }
  });
  
  // Save ALL invoices first before updating order
  if(invoicesToSave.length === 0){
    alert('⚠️ No confirmed loading instructions found!');
    return;
  }
  
  var savePromises = invoicesToSave.map(function(inv){ return saveInvoice(inv); });
  
  Promise.all(savePromises).then(function(){
    o.driverName = driver;
    o.helperName = helper;
    o.tmRegNo = tm;
    o.dispatchStatus = 'Y';
    o.dispatchDateTime = new Date().toISOString();
    
    saveOrder(o).then(function(){
      appAction.closeModals();
      alert('✅ Dispatch complete!\n\n'+invoicesToSave.length+' invoices created for Security.\nVehicle & driver details saved.');
      render();
    });
  }).catch(function(err){
    alert('❌ Error saving invoices: ' + err);
  });
};

};

appAction.confirmDivert = function(orderId){
  var o = STATE.orders.find(function(x){return x.id===orderId;});
  if(!o) return;
  var newPlant = document.getElementById('dv-plant').value;
  var by = document.getElementById('dv-by').value.trim();
  var instr = document.getElementById('dv-instr').value.trim();
  var reason = document.getElementById('dv-reason').value.trim();
  if(!newPlant || !by){ alert('Select plant and enter your name.'); return; }
  var divType = document.querySelector('input[name="dv-type"]:checked').value;
  var totalQty = parseFloat(o.qty) || 0;

  if(divType==='partial'){
    var divQty = parseFloat(document.getElementById('dv-qty').value);
    if(!divQty || divQty<=0){ alert('Enter a valid quantity to divert.'); return; }
    if(divQty >= totalQty){
      // effectively a full divert
      o.assignedPlant = newPlant; o.diverted = true; o.divertedBy = by;
      o.divertedInstructionOf = instr; o.divertedReason = reason;
      saveOrder(o).then(function(){ appAction.closeModals(); render(); });
      return;
    }
    var remainingQty = Math.round((totalQty - divQty)*100)/100;
    var newOrder = JSON.parse(JSON.stringify(o));
    newOrder.id = genId();
    newOrder.qty = String(divQty);
    newOrder.assignedPlant = newPlant;
    newOrder.diverted = true;
    newOrder.divertedBy = by;
    newOrder.divertedInstructionOf = instr;
    newOrder.divertedReason = reason;
    newOrder.originalPlant = o.assignedPlant;
    newOrder.splitFromOrderId = o.id;
    newOrder.dispatchStatus = 'N'; newOrder.dispatchDateTime=''; newOrder.driverName=''; newOrder.helperName=''; newOrder.tmRegNo=''; newOrder.tmContact='';
    o.qty = String(remainingQty);
    o.partialSplitNote = 'Split: '+divQty+' diverted to '+newPlant+' as '+newOrder.id;
    STATE.orders.push(newOrder);
    Promise.all([saveOrder(o), saveOrder(newOrder)]).then(function(){
      appAction.closeModals(); render();
    });
  } else {
    o.assignedPlant = newPlant;
    o.diverted = true;
    o.divertedBy = by;
    o.divertedInstructionOf = instr;
    o.divertedReason = reason;
    saveOrder(o).then(function(){
      appAction.closeModals();
      render();
    });
  }
};

  else if(STATE.adminTab==='triplog') html += renderAdminTripLog();

  else if(STATE.adminTab==='drivers' && STATE.user.isSuper) html += renderAdminDrivers();

function dashboardDetailsModalInner(detailType){
  var today = todayStr();
  var viewDate = STATE.dashDate || today;
  var allOrders = STATE.orders.filter(function(o){return o.dateReq===viewDate;});
  var dispatched = allOrders.filter(function(o){return o.dispatchStatus==='Y';});
  var pending = allOrders.filter(function(o){return o.dispatchStatus!=='Y';});
  
  var title = '';
  var orders = [];
  
  if(detailType === 'today'){
    title = '📦 Orders Today';
    orders = allOrders;
  } else if(detailType === 'dispatched'){
    title = '✅ Dispatched Orders';
    orders = dispatched;
  } else if(detailType === 'pending'){
    title = '⏳ Pending Orders';
    orders = pending;
  } else if(detailType === 'alltime'){

    '<div class="chart-wrapper" style="height:180px"><canvas id="chart-plants"></canvas></div>' +
  '</div>';
  
  html += '</div></div>';
  
  // Initialize charts after render
  setTimeout(function(){

  return html;
}

// Initialize Dashboard Charts
function initDashboardCharts(last7){
  var isDark = document.body.classList.contains('dark-theme');
  var textColor = isDark ? '#A0A0A0' : '#64748B';
  var gridColor = isDark ? '#333333' : '#E2E8F0';
  var bgColor = isDark ? 'rgba(100,100,100,0.05)' : 'rgba(30,95,217,0.05)';
  
  // Chart 1: Last 7 Days
  var ctx7 = document.getElementById('chart-7days');
  if(ctx7){
    new Chart(ctx7, {
      type:'line',
      data:{
        labels:last7.map(function(d){return d.date.slice(5).replace('-','/');  }),
        datasets:[{
          label:'Dispatches',
          data:last7.map(function(d){return d.count;}),
          borderColor:isDark ? '#60A5FA' : '#1E5FD9',
          backgroundColor:bgColor,
          borderWidth:2.5,
          fill:true,
          tension:0.4,
          pointRadius:4,
          pointBackgroundColor:isDark ? '#60A5FA' : '#1E5FD9',
          pointBorderColor:isDark ? '#1A1A2E' : '#fff',
          pointBorderWidth:2
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{
          y:{
            beginAtZero:true,
            ticks:{stepSize:1, color:textColor},
            grid:{color:gridColor}
          },
          x:{
            grid:{display:false},
            ticks:{color:textColor}
          }
        }
      }
    });
  }
  
  // Chart 2: Plants
  var ctxPlants = document.getElementById('chart-plants');
  if(ctxPlants && STATE.plants.length){
    var viewDate = STATE.dashDate || todayStr();
    var todays = STATE.orders.filter(function(o){return o.dateReq===viewDate;});
    var plantData = STATE.plants.filter(function(p){return p;}).map(function(p){
      return todays.filter(function(o){return o.assignedPlant===p;}).length;
    });
    var plantLabels = STATE.plants.filter(function(p){return p;});
    var colors = ['#1E5FD9', '#16A34A', '#F97316', '#DC2626', '#8B5CF6'];
    
    new Chart(ctxPlants, {
      type:'doughnut',
      data:{
        labels:plantLabels,
        datasets:[{
          data:plantData,
          backgroundColor:colors.slice(0,plantLabels.length),
          borderColor:isDark ? '#1A1A2E' : '#fff',
          borderWidth:2
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{position:'bottom',labels:{padding:12,usePointStyle:true,color:textColor,font:{size:12,weight:600}}}
        }
      }
    });
  }
}

appAction.saveEditedDistances = function(siteId){
  var site = STATE.sites.find(function(s){return s.id===siteId;});
  if(!site) return;
  
  // Get all fields
  var newName = document.getElementById('ed-name').value.trim();
  var newParty = document.getElementById('ed-party').value.trim();
  var newContact = document.getElementById('ed-contact').value.trim();
  var newMobile = document.getElementById('ed-mobile').value.trim();
  
  // Validate required fields
  if(!newName){
    showErrorMessage('Site name is required!', 2000);
    return;
  }
  
  // Update site details
  site.name = newName;
  site.party = newParty;
  site.contactPerson = newContact;
  site.contactMobile = newMobile;
  
  // Update distances
  if(!site.distances) site.distances = {};
  
  STATE.plants.filter(function(p){return p;}).forEach(function(p,i){
    var el = document.getElementById('ed-dist-'+i);
    if(el && el.value !== ''){
      site.distances[p] = Number(el.value);
    }
  });
  
  saveSite(site).then(function(){
    // Wait for firebase onSnapshot to update STATE
    setTimeout(function(){
      STATE.modal = null;
      showSuccessMessage('✅ Site updated successfully!', 2000);
      render();
    }, 400);
  }).catch(function(err){
    showErrorMessage('❌ Error saving: '+err.message, 2000);
  });
};

};

  var plantData = typeof STATE.plants[i] === 'string' ? {name: STATE.plants[i], address: '', contact: ''} : STATE.plants[i];
  plantData[field] = val.trim();
  STATE.plants[i] = plantData;
  savePlants().then(render);
};

appAction.removePlant = function(i){
  if(!confirm('Remove this plant? Orders associated with it may be affected.')) return;
  var old = typeof STATE.plants[i] === 'string' ? STATE.plants[i] : STATE.plants[i].name;
  STATE.plants.splice(i, 1);
  
  // Update orders that reference this plant
  STATE.orders.forEach(function(o){
    if(o.assignedPlant === old) o.assignedPlant = '';
    if(o.nearestPlant === old) o.nearestPlant = '';
  });
  
  Promise.all(
    [savePlants()].concat(STATE.orders.map(saveOrder))
  ).then(render);
};

appAction.addPlant = function(){
  STATE.plants.push({name: 'NEW PLANT', address: '', contact: ''});
  savePlants().then(render);
};

function renderAdminReports(){
  var today = todayStr();
  var from = STATE.repFrom || today.slice(0,8)+'01';
  var to = STATE.repTo || today;
  var gradeFilter = STATE.repGrade || 'ALL';

  // Show orders that have ANY loading instructions created (whether dispatched or pending)
  // Filter by date and check if order has any activity in the date range
  var inRange = STATE.orders.filter(function(o){ 
    // Check if order has any loading instructions
    var liForOrder = STATE.loadingInstructions.filter(function(li){return li.orderId===o.id;});
    if(liForOrder.length === 0) return false; // Only show if there are LIs
    
    // Filter by date range (use createdAt or dateReq)
    var orderDate = o.createdAt ? o.createdAt.substring(0,10) : o.dateReq;
    if(!orderDate) return false;
    
    return orderDate >= from && orderDate <= to;
  });

  var uniqueGrades = [];
  STATE.orders.forEach(function(o){ if(o.grade && uniqueGrades.indexOf(o.grade)===-1) uniqueGrades.push(o.grade); });
  uniqueGrades.sort();

  var partyFiltered = gradeFilter==='ALL' ? inRange : inRange.filter(function(o){return o.grade===gradeFilter;});
  var partyMap = {};
  partyFiltered.forEach(function(o){
    // Calculate dispatched qty for this order
    var liForOrder = STATE.loadingInstructions.filter(function(li){return li.orderId===o.id;});
    var dispatchedQty = liForOrder.reduce(function(sum, li){return sum + parseFloat(li.quantity||0);}, 0);
    if(dispatchedQty > 0){
      var key = o.party || o.siteName || '(unknown)';
      partyMap[key] = (partyMap[key]||0) + dispatchedQty;
    }
  });
  var partyRows = Object.keys(partyMap).map(function(k){return {party:k, qty:partyMap[k]};}).sort(function(a,b){return b.qty-a.qty;});
  var partyTotal = partyRows.reduce(function(s,r){return s+r.qty;},0);

  var gradeMap = {};
  var gradeTotal = 0;
  inRange.forEach(function(o){
    var liForOrder = STATE.loadingInstructions.filter(function(li){return li.orderId===o.id;});
    var dispatchedQty = liForOrder.reduce(function(sum, li){return sum + parseFloat(li.quantity||0);}, 0);
    if(dispatchedQty > 0){
      var g = o.grade || 'Unknown';
      gradeMap[g] = (gradeMap[g]||0) + dispatchedQty;
      gradeTotal += dispatchedQty;
    }
  });
  var gradeRows = Object.keys(gradeMap).map(function(g){
    return { grade:g, qty:gradeMap[g], pct: gradeTotal? Math.round(gradeMap[g]/gradeTotal*1000)/10 : 0 };
  }).sort(function(a,b){return b.qty-a.qty;});
  var gradeColors = ['var(--tcpl-blue)','var(--tcpl-orange)','var(--tcpl-green)','#8B5CF6','#EC4899','#0EA5E9','#F59E0B'];

  var html = '<div class="hero-banner">' + dateRangePicker('rep-from','rep-to',from,to,'appAction.setReportPreset') + '</div>';

  html += '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px">' +
      '<p style="font-weight:700;margin:0;color:var(--tcpl-blue-dark)">🏢 Party-wise Dispatched Quantity</p>' +
      '<div><label style="font-size:12px;color:var(--tcpl-muted);margin-right:6px">Grade filter</label><select id="rep-grade" style="height:32px;border-radius:8px;border:1.5px solid var(--tcpl-border)">' +
        '<option value="ALL" '+(gradeFilter==='ALL'?'selected':'')+'>All grades</option>' +
        uniqueGrades.map(function(g){return '<option value="'+esc(g)+'" '+(gradeFilter===g?'selected':'')+'>'+esc(g)+'</option>';}).join('') +
      '</select></div>' +
    '</div>' +
    '<div style="overflow-x:auto"><table class="log"><thead><tr><th>#</th><th>Party</th><th>Dispatched Qty</th><th>% of Total</th></tr></thead><tbody>' +
      (partyRows.length ? partyRows.map(function(r,i){
        var pct = partyTotal? Math.round(r.qty/partyTotal*1000)/10 : 0;
        return '<tr><td>'+(i+1)+'</td><td style="text-align:left">'+esc(r.party)+'</td><td>'+(Math.round(r.qty*10)/10)+'</td><td>'+pct+'%</td></tr>';
      }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--tcpl-muted)">No dispatched orders in this range.</td></tr>') +
    '</tbody></table></div>' +
    '<p style="text-align:right;font-weight:700;margin:8px 0 0;color:var(--tcpl-blue-dark)">Total: '+(Math.round(partyTotal*10)/10)+' Cum</p>' +
  '</div>';

  html += '<div class="card">' +
    '<p style="font-weight:700;margin:0 0 12px;color:var(--tcpl-blue-dark)">📊 Grade-wise Dispatched % (this period)</p>';
  gradeRows.forEach(function(r, i){
    var color = gradeColors[i % gradeColors.length];
    html += '<div style="margin-bottom:10px">' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span style="font-weight:600">'+esc(r.grade)+'</span><span>'+(Math.round(r.qty*10)/10)+' Cum &middot; <b>'+r.pct+'%</b></span></div>' +
      '<div style="height:14px;border-radius:7px;background:var(--tcpl-border);overflow:hidden"><div style="height:100%;width:'+r.pct+'%;background:'+color+';border-radius:7px"></div></div>' +
    '</div>';
  });
  if(!gradeRows.length) html += '<p style="color:var(--tcpl-muted)">No dispatched orders in this range.</p>';
  html += '</div>';
  return html;
}

// ===== Trip Log tab: driver/helper trip counts for a date range, grouped day/month/year =====
function renderAdminTripLog(){
  var today = todayStr();
  var from = STATE.tripFrom || today.slice(0,8)+'01';
  var to = STATE.tripTo || today;
  var groupBy = STATE.tripGroupBy || 'day';
  var selectedDriver = STATE.selectedTripDriver;

  // Use ONLY tripReports - completed trips जहाँ security ने return log किया है
  var trips = STATE.tripReports.filter(function(t){
    if(!t.inTime) return false; // Only trips with return logged
    
    // Handle BOTH old format (time only) and new format (date + time)
    var d = '';
    if(t.outTime){
      // Check if outTime has date already (format: "2026-08-19 10:49")
      if(t.outTime.includes('-') && t.outTime.length > 10){
        // New format: "2026-08-19 10:49"
        d = t.outTime.slice(0,10);
      } else if(t.outTime.includes('am') || t.outTime.includes('pm')){
        // Old format: "10:49 am" - use today's date
        d = today.slice(0,10);
      } else {
        // Unknown format - try to extract first 10 chars
        d = t.outTime.slice(0,10);
      }
    }
    
    return d>=from && d<=to;
  });

  function periodKey(dt){
    var d = dt ? dt.slice(0,10) : '';
    if(groupBy==='month') return d.slice(0,7);
    if(groupBy==='year') return d.slice(0,4);
    return d;
  }

  var driverMap = {};
  trips.forEach(function(t){
    var key = t.driverName || '(unknown driver)';
    if(!driverMap[key]) driverMap[key] = { helper:t.helperName||'', trips:0, periods:{}, tripList:[] };
    driverMap[key].trips++;
    
    driverMap[key].tripList.push({
      date: t.outTime ? t.outTime.slice(0,10) : '-',
      tm: t.tmNo || 'N/A',
      party: t.party || 'N/A',
      qty: t.quantity || 'N/A',
      outTime: t.outTime || '-',
      inTime: t.inTime || '-',
      kmTravelled: t.kmTravelled || 0,
      hoursWorked: t.hoursWorked || 0
    });
    
    var pk = periodKey(t.outTime);
    driverMap[key].periods[pk] = (driverMap[key].periods[pk]||0) + 1;
  });
  var driverRows = Object.keys(driverMap).map(function(k){return {driver:k, helper:driverMap[k].helper, trips:driverMap[k].trips, periods:driverMap[k].periods, tripList:driverMap[k].tripList};})
    .sort(function(a,b){return b.trips-a.trips;});

  var html = '<div class="hero-banner">' + dateRangePicker('trip-from','trip-to',from,to,'appAction.setTripPreset') +
    '<div style="margin-top:10px"><label style="font-size:12px;opacity:.85;margin-right:8px">Group by</label>' +
    ['day','month','year'].map(function(g){return '<button class="btn" style="height:30px;padding:4px 12px;margin-right:6px;'+(groupBy===g?'background:rgba(255,255,255,0.25);color:#fff;border-color:#fff':'')+'" onclick="appAction.setTripGroupBy(\''+g+'\')">'+g.charAt(0).toUpperCase()+g.slice(1)+'</button>';}).join('') +
    ' <button class="btn" style="height:30px;padding:4px 12px;margin-left:10px;background:rgba(100,200,255,0.3)" onclick="appAction.reloadTripReportData()">🔄 Reload Data</button>' +
    '</div></div>';

  // Debug info
  html += '<div style="background:rgba(100,200,255,0.1);border:1px solid rgba(100,200,255,0.3);border-radius:8px;padding:10px;margin-bottom:15px;font-size:11px;color:var(--tcpl-muted)">' +
    'Total trips in database: '+STATE.tripReports.length+' | Date range: '+from+' to '+to +
  '</div>';

  // Download & Print Options
  html += '<div style="margin-bottom:15px;display:flex;gap:10px;flex-wrap:wrap">' +
    '<button class="btn" style="padding:8px 15px;background:var(--tcpl-green);color:#fff;border-color:var(--tcpl-green)" onclick="appAction.downloadTripReportExcel(\''+from+'\',\''+to+'\')">📥 Download Excel</button>' +
    '<button class="btn" style="padding:8px 15px;background:var(--tcpl-orange);color:#fff;border-color:var(--tcpl-orange)" onclick="appAction.downloadTripReportPDF()">📄 Download PDF</button>' +
    '<button class="btn" style="padding:8px 15px;background:var(--tcpl-blue);color:#fff;border-color:var(--tcpl-blue)" onclick="window.print()">🖨️ Print</button>' +
  '</div>';

  // COMPLETE TRIP REPORT TABLE - Shows all details in tabular format
  html += '<div class="card" style="margin-bottom:20px">' +
    '<p style="font-weight:700;margin:0 0 12px;color:var(--tcpl-blue-dark)">📋 Complete Trip Report - All Details</p>' +
    '<div style="overflow-x:auto"><table class="log">' +
      '<thead><tr>' +
        '<th>Date</th>' +
        '<th>Party Name</th>' +
        '<th>TM No</th>' +
        '<th>Driver</th>' +
        '<th>Helper</th>' +
        '<th>Qty (CuM)</th>' +
        '<th>OUT Time</th>' +
        '<th>IN Time</th>' +
        '<th>Total Time (hrs)</th>' +
        '<th>Total KM</th>' +
        '<th>TM Hours Meter</th>' +
      '</tr></thead><tbody>';
  
  if(driverRows.length === 0){
    html += '<tr><td colspan="11" style="text-align:center;color:var(--tcpl-muted)">No completed trips in this range</td></tr>';
  } else {
    // Flatten all trips from all drivers
    var allTrips = [];
    driverRows.forEach(function(r){
      r.tripList.forEach(function(t){
        allTrips.push({
          date: t.date,
          party: t.party,
          tm: t.tm,
          driver: r.driver,
          helper: r.helper,
          qty: t.qty,
          outTime: t.outTime,
          inTime: t.inTime,
          kmTravelled: t.kmTravelled,
          hoursWorked: t.hoursWorked
        });
      });
    });
    
    // Sort by date descending
    allTrips.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
    
    // Helper function to calculate time difference
    function calculateTimeDifference(outTimeStr, inTimeStr){
      try {
        // Handle both old format ("10:49 am") and new format ("2026-08-19 10:49")
        
        var outHours, outMins, inHours, inMins;
        
        // Parse OUT time

            outMins = parseInt(match[2]) || 0;
          } else {
            return '-';
          }

          // New format: "2026-08-19 10:49"
          var parts = outTimeStr.split(' ');

            var timeParts = parts[1].split(':');
            outHours = parseInt(timeParts[0]);
            outMins = parseInt(timeParts[1]) || 0;
          } else {

          } else {

        var diffMins = inTotalMins - outTotalMins;
        if(diffMins < 0) diffMins += 24*60; // Handle day change
        
        var hours = Math.floor(diffMins / 60);

appAction.downloadTripReportExcel = function(from, to){
  // Get trips for this date range
  var trips = STATE.tripReports.filter(function(t){
    if(!t.inTime) return false;
    var d = '';
    if(t.outTime){
      if(t.outTime.includes('-') && t.outTime.length > 10){
        d = t.outTime.slice(0,10);
      } else if(t.outTime.includes('am') || t.outTime.includes('pm')){
        d = todayStr().slice(0,10);
      } else {
        d = t.outTime.slice(0,10);
      }
    }
    return d>=from && d<=to;
  });
  
  // Create CSV data
  var csv = 'Date,Party Name,TM No,Driver,Helper,Qty (CuM),OUT Time,IN Time,Total Time,Total KM,TM Hours Meter\n';
  
  // Helper function for time calculation
  function calculateTimeDiff(outTimeStr, inTimeStr){
    try {
      var outHours, outMins, inHours, inMins;
      if(outTimeStr.includes('am') || outTimeStr.includes('pm')){
        var match = outTimeStr.match(/(\d+):(\d+)/);
        if(match){
          outHours = parseInt(match[1]);
          outMins = parseInt(match[2]) || 0;
        } else {
          return '-';
        }
      } else {
        var parts = outTimeStr.split(' ');
        if(parts.length >= 2){
          var timeParts = parts[1].split(':');
          outHours = parseInt(timeParts[0]);
          outMins = parseInt(timeParts[1]) || 0;
        } else {
          return '-';
        }
      }
      if(inTimeStr.includes('am') || inTimeStr.includes('pm')){
        var match = inTimeStr.match(/(\d+):(\d+)/);
        if(match){
          inHours = parseInt(match[1]);
          inMins = parseInt(match[2]) || 0;
        } else {
          return '-';
        }
      } else {
        var parts = inTimeStr.split(' ');
        if(parts.length >= 2){
          var timeParts = parts[1].split(':');
          inHours = parseInt(timeParts[0]);
          inMins = parseInt(timeParts[1]) || 0;
        } else {
          return '-';
        }
      }
      var outTotalMins = outHours * 60 + outMins;
      var inTotalMins = inHours * 60 + inMins;
      var diffMins = inTotalMins - outTotalMins;
      if(diffMins < 0) diffMins += 24*60;
      var hours = Math.floor(diffMins / 60);
      var mins = diffMins % 60;
      return hours + 'h ' + mins + 'm';
    } catch(e) {
      return '-';
    }
  }
  
  // Add data rows
  trips.forEach(function(t){
    var date = t.outTime ? t.outTime.slice(0,10) : '-';
    var timeDuration = calculateTimeDiff(t.outTime, t.inTime);
    var row = [
      date,
      '"'+t.party+'"',
      t.tmNo || '-',
      t.driverName || '-',
      t.helperName || '-',
      t.quantity || '-',
      t.outTime || '-',
      t.inTime || '-',
      timeDuration,
      parseFloat(t.kmTravelled||0).toFixed(0),
      parseFloat(t.hoursWorked||0).toFixed(2)
    ];
    csv += row.join(',') + '\n';
  });
  
  // Download CSV
  var element = document.createElement('a');
  element.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv));
  element.setAttribute('download', 'Trip_Report_'+from+'_to_'+to+'.csv');
  element.style.display = 'none';
  document.body.appendChild(element);
  element.click();
  document.body.removeChild(element);
  alert('✅ Trip report exported to CSV! (Opens in Excel)');
};

      var outHours, outMins, inHours, inMins;
      if(outTimeStr.includes('am') || outTimeStr.includes('pm')){
        var match = outTimeStr.match(/(\d+):(\d+)/);
        if(match){
          outHours = parseInt(match[1]);
          outMins = parseInt(match[2]) || 0;
        } else {
          return '-';
        }
      } else {
        var parts = outTimeStr.split(' ');
        if(parts.length >= 2){
          var timeParts = parts[1].split(':');
          outHours = parseInt(timeParts[0]);
          outMins = parseInt(timeParts[1]) || 0;
        } else {
          return '-';
        }
      }
      if(inTimeStr.includes('am') || inTimeStr.includes('pm')){
        var match = inTimeStr.match(/(\d+):(\d+)/);
        if(match){
          inHours = parseInt(match[1]);
          inMins = parseInt(match[2]) || 0;
        } else {
          return '-';
        }
      } else {
        var parts = inTimeStr.split(' ');
        if(parts.length >= 2){
          var timeParts = parts[1].split(':');
          inHours = parseInt(timeParts[0]);
          inMins = parseInt(timeParts[1]) || 0;
        } else {
          return '-';
        }
      }
      var outTotalMins = outHours * 60 + outMins;
      var inTotalMins = inHours * 60 + inMins;
      var diffMins = inTotalMins - outTotalMins;
      if(diffMins < 0) diffMins += 24*60;
      var hours = Math.floor(diffMins / 60);
      var mins = diffMins % 60;
      return hours + 'h ' + mins + 'm';
    } catch(e) {
      return '-';
    }
  }
  
  // Build CSV for individual person
  var csv = 'Date,Party,TM,Other Person,Qty,OUT Time,IN Time,Total Time,Total KM,TM Hours Meter\n';
  
  // Filter trips for this person
  var personTrips = [];
  STATE.tripReports.forEach(function(t){
    if(!t.inTime) return;
    if(personType === 'driver' && t.driverName === personName){
      personTrips.push({date: t.outTime ? t.outTime.slice(0,10) : '-', party: t.party, tm: t.tmNo, other: t.helperName || '-', qty: t.quantity, outTime: t.outTime, inTime: t.inTime, km: t.kmTravelled, hrs: t.hoursWorked});
    } else if(personType === 'helper' && t.helperName === personName){
      personTrips.push({date: t.outTime ? t.outTime.slice(0,10) : '-', party: t.party, tm: t.tmNo, other: t.driverName || '-', qty: t.quantity, outTime: t.outTime, inTime: t.inTime, km: t.kmTravelled, hrs: t.hoursWorked});
    }
  });
  
  personTrips.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  
  personTrips.forEach(function(t){
    var timeDuration = calculateTimeDiff(t.outTime, t.inTime);
    var row = [
      t.date,
      '"'+t.party+'"',
      t.tm || '-',
      '"'+t.other+'"',
      t.qty || '-',
      t.outTime || '-',
      t.inTime || '-',
      timeDuration,
      parseFloat(t.km||0).toFixed(0),
      parseFloat(t.hrs||0).toFixed(2)
    ];
    csv += row.join(',') + '\n';
  });
  
  var fileName = personType.charAt(0).toUpperCase() + personType.slice(1) + '_' + personName + '_Trips.csv';
  var element = document.createElement('a');
  element.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv));
  element.setAttribute('download', fileName);
  element.style.display = 'none';
  document.body.appendChild(element);
  element.click();
  document.body.removeChild(element);
  alert('✅ Trips exported for ' + personName + '! (CSV format - opens in Excel)');
};

  }
  
  var confirmed = confirm('⚠️ WARNING: This will DELETE ALL:\n\n✓ Orders\n✓ Loading Instructions\n✓ Invoices\n✓ Trip Reports\n\nThis CANNOT be undone!\n\nAre you 100% sure?');
  if(!confirmed) return;
  
  var doubleConfirm = prompt('Type "DELETE" to confirm permanent deletion:');
  if(doubleConfirm !== 'DELETE'){
    showErrorMessage('Cleanup cancelled - confirmation not matched', 2000);
    return;
  }
  
  // Get counts and IDs BEFORE clearing
  var ordersToDelete = STATE.orders.slice();
  var lisToDelete = STATE.loadingInstructions.slice();
  var invoicesToDelete = STATE.invoices.slice();
  var tripsToDelete = STATE.tripReports.slice();
  var logsToDelete = STATE.gateLogs.slice();
  
  var counts = {
    orders: ordersToDelete.length,
    lis: lisToDelete.length,
    invoices: invoicesToDelete.length,
    trips: tripsToDelete.length
  };
  
  // Clear from state
  STATE.orders = [];
  STATE.loadingInstructions = [];
  STATE.invoices = [];
  STATE.tripReports = [];
  STATE.gateLogs = [];
  
  // Delete from Firebase
  if(db){
    ordersToDelete.forEach(function(o){
      if(o.id) db.collection('orders').doc(o.id).delete().catch(function(e){
        console.log('Deleted order:', o.id);
      });
    });
    
    lisToDelete.forEach(function(li){
      if(li.id) db.collection('loadingInstructions').doc(li.id).delete().catch(function(e){
        console.log('Deleted LI:', li.id);
      });
    });
    
    invoicesToDelete.forEach(function(inv){
      if(inv.id) db.collection('invoices').doc(inv.id).delete().catch(function(e){
        console.log('Deleted invoice:', inv.id);
      });
    });
    
    tripsToDelete.forEach(function(trip){
      if(trip.id) db.collection('tripReports').doc(trip.id).delete().catch(function(e){
        console.log('Deleted trip:', trip.id);
      });
    });
    
    logsToDelete.forEach(function(log){
      if(log.id) db.collection('gateLogs').doc(log.id).delete().catch(function(e){
        console.log('Deleted log:', log.id);
      });
    });
  }
  
  var msg = '✅ CLEANUP COMPLETE!\n' + counts.orders + ' orders\n' + counts.lis + ' loading instructions deleted';
  showSuccessMessage(msg, 3000);
  setTimeout(function(){ render(); }, 500);
};

// ===== OPERATOR VIEW (Plant Operator) =====
function renderOperator(app){
  // Apply date filtering if dates are selected
  var allLIs = STATE.loadingInstructions.slice();
  if(STATE.operatorDateFrom || STATE.operatorDateTo){
    allLIs = allLIs.filter(function(li){
      var liDate = li.createdAt;
      // If no date and filter is active, exclude this LI
      if(!liDate) return false;
      
      var lDate = new Date(liDate).toISOString().split('T')[0];
      console.log('LI:', li.party, '| Created:', lDate, '| From:', STATE.operatorDateFrom, '| To:', STATE.operatorDateTo);
      
      // Both from and to are set - check range
      if(STATE.operatorDateFrom && STATE.operatorDateTo){
        return lDate >= STATE.operatorDateFrom && lDate <= STATE.operatorDateTo;
      }
      // Only from date is set
      if(STATE.operatorDateFrom){
        return lDate >= STATE.operatorDateFrom;
      }
      // Only to date is set
      if(STATE.operatorDateTo){
        return lDate <= STATE.operatorDateTo;
      }
      return true;

        '<input type="date" id="operator-to-date" value="'+(STATE.operatorDateTo||'')+'" style="width:100%;padding:8px;border:1px solid var(--tcpl-border);border-radius:6px;font-size:13px" onchange="appAction.setOperatorDateTo(this.value)">' +

appAction.logVehicleOut = function(invId){
  var inv = STATE.invoices.find(function(x){return x.id===invId;});
  if(!inv) return;
  var dateOut = (document.getElementById('dateout-'+invId) ? document.getElementById('dateout-'+invId).value : '').trim();
  var timeOut = (document.getElementById('timeout-'+invId) ? document.getElementById('timeout-'+invId).value : '').trim();
  var kmOut = (document.getElementById('kmout-'+invId) ? document.getElementById('kmout-'+invId).value : '').trim();
  var hrsOut = (document.getElementById('hrsout-'+invId) ? document.getElementById('hrsout-'+invId).value : '').trim();
  
  if(!dateOut || !kmOut || !hrsOut){ 
    alert('⚠️ Fill all fields: Date, KM Reading, and Hours Meter'); 
    return; 
  }
  
  // Use provided time, or auto-capture current time
  var timeStr = timeOut;
  if(!timeOut){
    // Auto-capture current time if not provided
    var now = new Date();
    timeStr = String(now.getHours()).padStart(2,'0') + ':' + 
              String(now.getMinutes()).padStart(2,'0');
  }
  
  var dateStr = dateOut; // Already in YYYY-MM-DD format from date input
  
  var log = {
    id: 'GL-'+Date.now(),
    invoiceId: invId,
    party: inv.party,
    tmNo: inv.tmNo,
    driverName: inv.driverName,
    helperName: inv.helperName || '',
    quantity: inv.quantity,
    status: 'out',
    outTime: dateStr + ' ' + timeStr,
    kmOut: parseFloat(kmOut),
    hrsOut: parseFloat(hrsOut),
    outDate: dateStr
  };
  
  STATE.gateLogs.push(log);
  saveGateLog(log).then(function(){
    alert('✅ Vehicle logged OUT!\n\nDate: '+dateStr+' | Time: '+timeStr+' | KM: '+kmOut+' | Hrs: '+hrsOut);
    render();
  });
};

appAction.logVehicleReturn = function(logId){
  var log = STATE.gateLogs.find(function(x){return x.id===logId;});
  if(!log) return;
  var kmIn = document.getElementById('kmin-'+logId).value.trim();
  var hrsIn = document.getElementById('hrsin-'+logId).value.trim();
  if(!kmIn || !hrsIn){ alert('Fill all fields'); return; }
  
  var kmTravelled = parseFloat(kmIn) - parseFloat(log.kmOut);
  var hoursWorked = parseFloat(hrsIn) - parseFloat(log.hrsOut);
  
  var now = new Date();
  var dateStr = now.getFullYear() + '-' + 
                String(now.getMonth()+1).padStart(2,'0') + '-' + 
                String(now.getDate()).padStart(2,'0');
  var timeStr = String(now.getHours()).padStart(2,'0') + ':' + 
                String(now.getMinutes()).padStart(2,'0');
  
  log.status = 'completed';
  log.inTime = dateStr + ' ' + timeStr;
  log.kmIn = parseFloat(kmIn);
  log.hrsIn = parseFloat(hrsIn);
  
  var trip = {
    id: 'TR-'+Date.now(),
    invoiceId: log.invoiceId,
    party: log.party,
    tmNo: log.tmNo,
    driverName: log.driverName,
    helperName: log.helperName,
    quantity: log.quantity,
    outTime: log.outTime,
    inTime: log.inTime,
    kmTravelled: kmTravelled,
    hoursWorked: hoursWorked
  };
  
  STATE.gateLogs = STATE.gateLogs.map(function(x){return x.id===logId ? log : x;});
  STATE.tripReports.push(trip);
  
  saveGateLog(log).then(function(){
    saveTripReport(trip).then(function(){
      alert('✅ Vehicle logged RETURN!\\n\\nTrip Report Created:\\nDuration: ' + log.inTime + '\\nKM Travelled: ' + kmTravelled + '\\nHours Worked: ' + hoursWorked.toFixed(2));
      render();
    });
  });
};

loadAll();

})();
</script>
</body>
