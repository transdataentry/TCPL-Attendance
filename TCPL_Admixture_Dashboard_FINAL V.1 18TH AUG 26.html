function exportMultiSheetExcel(filename, sheets){
  showToast('Preparing Excel file…');
  
  // Try multiple CDNs
  const cdnUrls = [
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js'
  ];
  
  function tryLoadFromCdn(index) {
    if(index >= cdnUrls.length) {
      showToast('Excel library not available — creating CSV instead');
      downloadAsCSV(filename.replace('.xlsx', '.csv'), sheets[0].data);
      return;
    }
    
    const script = document.createElement('script');
    script.src = cdnUrls[index];
    script.timeout = 5000;
    
    script.onload = () => {
      try {
        const workbook = XLSX.utils.book_new();
        
        sheets.forEach(sheet => {
          const worksheet = XLSX.utils.aoa_to_sheet(sheet.data);
          // Set column widths
          const maxWidth = Math.max(...sheet.data.map(row => Math.max(...row.map(cell => String(cell || '').length))));
          worksheet['!cols'] = Array(sheet.data[0].length).fill({wch: Math.min(25, maxWidth + 3)});
          XLSX.utils.book_append_sheet(workbook, worksheet, sheet.name);
        });
        
        XLSX.writeFile(workbook, filename);
        showToast('✅ Excel downloaded: ' + filename);
      } catch(err){
        showToast('Error: ' + err.message);
      }
    };
    
    script.onerror = () => {
      console.log('Failed CDN: ' + cdnUrls[index]);
      tryLoadFromCdn(index + 1);
    };
    
    document.head.appendChild(script);
  }
  
  tryLoadFromCdn(0);
}

function downloadAsCSV(filename, data){
  const csv = data.map(row => 
    row.map(cell => {
      const val = String(cell || '');
      return val.includes(',') || val.includes('"') ? '"' + val.replace(/"/g, '""') + '"' : val;
    }).join(',')
  ).join('\n');
  
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', filename);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('✅ CSV downloaded: ' + filename);
}

function stockAsOfDate(productName, cutoffDate){
  let produced = 0, dispatched = 0;
  STATE.production.forEach(p=>{ if(p.productName===productName && p.date<cutoffDate) produced += Number(p.actualQty)||0; });
  STATE.dispatchInvoices.forEach(inv=>{
    if(!(inv.date<cutoffDate)) return;
    inv.lines.forEach(l=>{
      const pname = l.product || (STATE.production.find(pp=>pp.batchNo===l.batchNo)||{}).productName || inv.productName;
      if(pname===productName) dispatched += Number(l.qty)||0;
    });
  });
  return produced - dispatched;
}
function productionInRange(productName, from, to){
  return STATE.production.filter(p=>p.productName===productName && (!from||p.date>=from) && (!to||p.date<=to)).reduce((s,p)=>s+(Number(p.actualQty)||0),0);
}
function dispatchInRange(productName, from, to){
  let sum=0;
  STATE.dispatchInvoices.forEach(inv=>{
    if(from && inv.date<from) return;
    if(to && inv.date>to) return;
    inv.lines.forEach(l=>{
      const pname = l.product || (STATE.production.find(pp=>pp.batchNo===l.batchNo)||{}).productName || inv.productName;
      if(pname===productName) sum += Number(l.qty)||0;
    });
  });
  return sum;
}
function drumOrPouchText(rec, kg){
  if(rec && rec.isPouch) return fmt(kg/rec.pouchWeightKg)+' '+(rec.packagingLabel||'pcs');
  if(rec && rec.drumSizeKg) return fmt(kg/rec.drumSizeKg)+' drums';
  return '';
}
function renderReportSummary(){

  const rows = recipes.map(rec=>{

    const manufactured = productionInRange(rec.productName, from, to);

function currentReportRows(){

  const from = document.getElementById('rFrom')?.value;
  const to = document.getElementById('rTo')?.value;

}
function renderReportTable(rows){

async function fullHistoricalReset(){
  if(!confirm('This will remove old imported (historical) production & dispatch records and reload the current correct set. Any entries YOU made through this app stay untouched. Continue?')) return;
  const statusEl = document.getElementById('resetStatus');
  statusEl.textContent = 'Resetting…';
  const seedState = buildSeedState();

  // 1) Remove ALL historical production/dispatch records (old + possibly
  // duplicated across repeated Repair runs), then reload the clean set.
  const oldHistProd = STATE.production.filter(p=>p.historical);
  const oldHistDisp = STATE.dispatchInvoices.filter(d=>d.historical);
  STATE.production = STATE.production.filter(p=>!p.historical);
  STATE.dispatchInvoices = STATE.dispatchInvoices.filter(d=>!d.historical);

  if(CLOUD_OK){
    for(const rec of oldHistProd){ try{ await DB.collection('production').doc(rec.id).delete(); }catch(e){ console.error(e); } }
    for(const inv of oldHistDisp){ try{ await DB.collection('dispatchInvoices').doc(inv.id).delete(); }catch(e){ console.error(e); } }
  }

  // 2) Re-insert the current correct historical set
  for(const rec of seedState.production){
    STATE.production.push(rec);
    if(CLOUD_OK){ try{ await DB.collection('production').doc(rec.id).set(rec); }catch(e){ console.error(e); } }
  }
  for(const inv of seedState.dispatchInvoices){
    STATE.dispatchInvoices.push(inv);
    if(CLOUD_OK){ try{ await DB.collection('dispatchInvoices').doc(inv.id).set(inv); }catch(e){ console.error(e); } }
  }

  // 3) Refresh masters (recipes/opening stock/opening finished stock) to the
  // latest known-correct values too, since these can also go stale.
  STATE.recipes = seedState.recipes;
  STATE.openingStock = seedState.openingStock;
  STATE.openingFinishedStock = seedState.openingFinishedStock;
  STATE.batchSeq = seedState.batchSeq;
  STATE.invoiceSeq = seedState.invoiceSeq;
  await saveConfig();
  if(CLOUD_OK){
    try{ await DB.collection('tcpl').doc('counters').set({batchSeq: STATE.batchSeq, invoiceSeq: STATE.invoiceSeq}); }catch(e){ console.error(e); }
  }

  const fin = finishedStockByProduct();
  statusEl.innerHTML = `<span style="color:var(--ok);">✓ Reset complete.</span><br>
    Removed ${oldHistProd.length} old production + ${oldHistDisp.length} old dispatch records, reloaded ${seedState.production.length} + ${seedState.dispatchInvoices.length} current ones.<br><br>
    <b>SPECIAL (K): ${fmt(fin.byProduct['SPECIAL (K)']||0)} kg · TCPL (HRA): ${fmt(fin.byProduct['TCPL (HRA)']||0)} kg · Pumping Prime: ${fmt(fin.byProduct['PUMPING PRIME']||0)} kg</b>`;
  showToast('Historical data reset ✓');
}
async function repairSystemData(){
  const statusEl = document.getElementById('repairStatus');
  statusEl.textContent = 'Checking…';
  const seedState = buildSeedState();
  const added = [];

  // 1) Missing recipes (e.g. Pumping Prime added after you first connected)
  seedState.recipes.forEach(sr=>{
    if(!STATE.recipes.find(r=>r.productName===sr.productName)){
      STATE.recipes.push(sr); added.push('Recipe: '+sr.productName);
    }
  });
  // 2) Missing fields on existing recipes (hsn, drumSizeKg, isPouch, pouchWeightKg)
  STATE.recipes.forEach(r=>{
    const sr = seedState.recipes.find(x=>x.productName===r.productName);
    if(!sr) return;
    ['hsn','drumSizeKg','isPouch','pouchWeightKg','packagingLabel'].forEach(f=>{
      if(r[f]===undefined && sr[f]!==undefined){ r[f]=sr[f]; if(!added.includes('Recipe field: '+f+' on '+r.productName)) added.push('Recipe field: '+f+' on '+r.productName); }
    });
  });
  // 3) Opening finished stock
  if(!STATE.openingFinishedStock) STATE.openingFinishedStock = {};
  Object.entries(seedState.openingFinishedStock).forEach(([k,v])=>{
    if(STATE.openingFinishedStock[k]===undefined){ STATE.openingFinishedStock[k]=v; added.push('Opening stock: '+k); }
  });
  // 3b) Opening stock rate map (may not exist on older connected databases)
  if(!STATE.openingStockRate){ STATE.openingStockRate = {}; added.push('Opening Stock Rate field'); }
  // 4) Company / plant address fields
  if(!STATE.company) { STATE.company = seedState.company; added.push('Company details'); }
  if(!STATE.plants.addresses) { STATE.plants.addresses = seedState.plants.addresses; added.push('Plant addresses'); }

  if(added.length){ await saveConfig(); }

  // 5) Missing historical production records (e.g. PAP1, OPENING-PAP)
  const existingProdIds = new Set(STATE.production.map(p=>p.id));
  for(const rec of seedState.production){
    if(rec.historical && !existingProdIds.has(rec.id)){
      STATE.production.push(rec);
      if(CLOUD_OK){ try{ await DB.collection('production').doc(rec.id).set(rec); }catch(e){ console.error(e); } }
      added.push('Production batch: '+rec.batchNo);
    }
  }
  // 6) Missing historical dispatch invoices
  const existingDispIds = new Set(STATE.dispatchInvoices.map(d=>d.id));
  for(const inv of seedState.dispatchInvoices){
    if(inv.historical && !existingDispIds.has(inv.id)){
      STATE.dispatchInvoices.push(inv);
      if(CLOUD_OK){ try{ await DB.collection('dispatchInvoices').doc(inv.id).set(inv); }catch(e){ console.error(e); } }
      added.push('Dispatch: '+inv.invoiceNo+' ('+inv.plant+')');
    }
  }

  // 7) Known data correction — Pumping Pouch's original cost was computed
  // wrongly (2 of its 3 raw materials had no purchase entry yet, so the cost
  // came out as ~₹21/kg instead of the correct ₹107.3/kg = ₹26.83/pouch from
  // the original costing sheet). This fixes it even if the wrong records
  // were already saved to the cloud earlier.
  const CORRECT_PAP_COST = 107.3;
  for(const id of ['b_PAP1','b_OPENING-PAP']){
    const rec = STATE.production.find(p=>p.id===id);
    if(rec && Math.abs((rec.costPerKg||0) - CORRECT_PAP_COST) > 0.01){
      rec.costPerKg = CORRECT_PAP_COST;
      if(CLOUD_OK){ try{ await DB.collection('production').doc(id).set(rec); }catch(e){ console.error(e); } }
      added.push('Corrected cost price: '+rec.batchNo+' → ₹'+CORRECT_PAP_COST+'/kg');
    }
  }
  for(const inv of STATE.dispatchInvoices){
    let changed = false;
    inv.lines.forEach(l=>{
      if((l.batchNo==='PAP1'||l.batchNo==='OPENING-PAP') && Math.abs((l.rate||0)-CORRECT_PAP_COST)>0.01){
        l.rate = CORRECT_PAP_COST; changed = true;
      }
    });
    if(changed){
      inv.totalAmount = inv.lines.reduce((s,l)=>s+l.qty*l.rate,0);
      if(CLOUD_OK){ try{ await DB.collection('dispatchInvoices').doc(inv.id).set(inv); }catch(e){ console.error(e); } }
      added.push('Corrected dispatch amount: '+inv.invoiceNo);
    }
  }
  // 7c) Fix a boundary-date bug: the opening-stock placeholder batch for
  // Pumping Pouch was originally dated exactly on FY-start (1 Apr), which
  // made date-range reports miscount it as "produced this year" instead of
  // "opening balance" (its Opening showed 0 instead of the true 90 kg /
  // 360 pouches). Move it one day earlier so it always counts as opening.
  const openingPap = STATE.production.find(p=>p.id==='b_OPENING-PAP');
  if(openingPap && openingPap.date >= '2026-04-01'){
    openingPap.date = '2026-03-31';
    if(CLOUD_OK){ try{ await DB.collection('production').doc('b_OPENING-PAP').set(openingPap); }catch(e){ console.error(e); } }
    added.push('Fixed Opening Stock date for Pumping Pouch');
  }

  // 7b) Any OTHER Pumping Prime batches (e.g. new ones you produced yourself
  // before Opening Stock Rate was available) may also carry an understated
  // cost. Recompute them now using today's rates (which include the Opening
  // Stock Rate fallback) if the stored cost looks implausibly low.
  for(const rec of STATE.production){
    if(rec.productName!=='PUMPING PRIME' || rec.id==='b_PAP1' || rec.id==='b_OPENING-PAP') continue;
    if(!rec.ingredientsUsed || rec.ingredientsUsed.length===0) continue;
    if((rec.costPerKg||0) >= 50) continue; // looks plausible already, leave it
    let cost = 0;
    rec.ingredientsUsed.forEach(ing=>{ cost += ing.qty*lastPurchaseRate(ing.item, rec.date); });
    const totalKg = rec.totalQty||1;
    const recomputed = Math.round((cost/totalKg)*100)/100;
    if(recomputed > rec.costPerKg){
      rec.costPerKg = recomputed;
      if(CLOUD_OK){ try{ await DB.collection('production').doc(rec.id).set(rec); }catch(e){ console.error(e); } }
      added.push('Recomputed cost price: '+rec.batchNo+' → ₹'+recomputed+'/kg');
    }
  }

  // 8) Add WATER to production batches that don't have it (newly added to recipe ingredients)
  STATE.production.forEach(batch => {
    const recipe = STATE.recipes.find(r => r.productName === batch.productName);
    if (!recipe) return;
    
    // Check if WATER is already in ingredientsUsed
    const hasWater = batch.ingredientsUsed && batch.ingredientsUsed.find(ing => ing.item === 'WATER');
    
    if (!hasWater && recipe.waterKg > 0) {
      // Add WATER to the beginning of ingredientsUsed array
      if (!batch.ingredientsUsed) batch.ingredientsUsed = [];
      batch.ingredientsUsed.unshift({item: 'WATER', qty: recipe.waterKg});
      
      // Recalculate cost with WATER included
      let cost = 0;
      batch.ingredientsUsed.forEach(ing => {
        cost += ing.qty * lastPurchaseRate(ing.item, batch.date);
      });
      const totalKg = batch.totalQty || 1;
      const newCostPerKg = totalKg > 0 ? Math.round((cost / totalKg) * 100) / 100 : 0;
      batch.costPerKg = newCostPerKg;
      
      if (CLOUD_OK) {
        try { DB.collection('production').doc(batch.id).set(batch); } catch(e) { console.error(e); }
      }
      added.push('Added WATER to: ' + batch.batchNo + ' (recalc cost → ₹' + newCostPerKg + '/kg)');
    }
  });

  // 9) Fix invoice amounts that were calculated with Math.round() truncating decimals
  STATE.dispatchInvoices.forEach(inv=>{
    const correctTotal = inv.lines.reduce((s,l)=>s+l.qty*l.rate,0);
    if(Math.abs(correctTotal - inv.totalAmount) > 0.01){  // If there's a discrepancy > 1 paisa
      inv.totalAmount = correctTotal;
      if(CLOUD_OK){ try{ DB.collection('dispatchInvoices').doc(inv.id).set(inv); }catch(e){ console.error(e); } }
      added.push('Fixed invoice amount: '+inv.invoiceNo+' → ₹'+correctTotal.toFixed(2));
    }
  });

  const papRecipe = STATE.recipes.find(r=>r.productName==='PUMPING PRIME');
  const papCostNow = papRecipe ? (displayCostPerKg(papRecipe)*papRecipe.pouchWeightKg).toFixed(2) : 'n/a';
  const verifyLine = '<br><br><b>Pumping Prime cost right now: ₹'+papCostNow+' / pouch</b> (should read ₹26.83)';

  if(added.length===0){
    statusEl.innerHTML = '<span style="color:var(--ok);">✓ Everything is already up to date — nothing to repair.</span>'+verifyLine;
  } else {
    statusEl.innerHTML = '<span style="color:var(--ok);">✓ Repaired/added '+added.length+' item(s):</span><br>'+added.map(a=>'• '+a).join('<br>')+verifyLine;
    showToast('Repair complete ✓');
  }
  if(ACTIVE_TAB==='masters'){ /* stay put so the status message stays visible */ }
}
async function downloadFullBackup(){
  showToast('Preparing full backup…');
  try{ await loadXLSXLib(); }
  catch(e){ showToast('Could not load Excel library — check internet connection'); return; }

  const wb = XLSX.utils.book_new();

  const vendorsAoa = [['Vendor Name']]; STATE.vendors.forEach(v=>vendorsAoa.push([v.name]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(vendorsAoa), 'Vendors');

  const itemsAoa = [['Item Name','Unit','Current Stock (kg)']];
  STATE.items.forEach(i=>itemsAoa.push([i.name, i.unit, rawStockOf(i.name)]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(itemsAoa), 'Items & Stock');

  const recipesAoa = [['Product','Prefix','HSN','Batch Kg','Wastage Kg','Water Kg','Is Pouch','Pouch Weight Kg','Ingredient','Qty per Batch']];
  STATE.recipes.forEach(r=>{
    r.ingredients.forEach((ing,idx)=>{
      recipesAoa.push(idx===0 ? [r.productName,r.prefix,r.hsn,r.batchKg,r.wastageKg,r.waterKg,r.isPouch?'Yes':'No',r.pouchWeightKg||'',ing.item,ing.qty]
                               : ['','','','','','','','',ing.item,ing.qty]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(recipesAoa), 'Recipes');

  const purchAoa = [['Date','Invoice No','Vendor','Item','Qty (kg)','Rate/kg','SGST %','CGST %','Total (₹)']];
  [...STATE.purchases].sort((a,b)=>a.date<b.date?-1:1).forEach(p=>purchAoa.push([p.date,p.invoiceNo,p.vendor,p.item,p.qty,p.rate,p.sgst,p.cgst,p.total]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(purchAoa), 'Purchases');

  const prodAoa = [['Batch No','Date','Product','Actual Qty (kg)','Wastage (kg)','Total (kg)','Cost/kg (₹)','Ingredients Used']];
  [...STATE.production].sort((a,b)=>a.date<b.date?-1:1).forEach(b=>{
    const ingText = (b.ingredientsUsed||[]).map(i=>`${i.item}: ${i.qty}kg`).join('; ');
    prodAoa.push([b.batchNo,b.date,b.productName,b.actualQty,b.wastageQty,b.totalQty,b.costPerKg,ingText]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(prodAoa), 'Production');

  const dispAoa = [['Invoice/Challan No','Date','Plant','Self Dispatch','Batches','Total Qty (kg)','Total Amount (₹)','Truck No','Mode of Transport']];
  [...STATE.dispatchInvoices].sort((a,b)=>a.date<b.date?-1:1).forEach(d=>{
    dispAoa.push([d.invoiceNo,d.date,d.plant,(d.selfDispatch||isSelfPlant(d.plant))?'Yes':'No',d.lines.map(l=>l.batchNo+' ('+l.qty+'kg)').join(', '),d.totalQty,d.totalAmount,d.vehicleNo||'',d.modeOfTransport||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dispAoa), 'Dispatch');

  const usersAoa = [['Username','Name','Full Access','Purchase','Production','Dispatch','Reports','Plant View Access']];
  STATE.users.forEach(u=>usersAoa.push([u.username,u.name,u.isAdmin?'Yes':'No',u.permissions.purchase?'Yes':'No',u.permissions.production?'Yes':'No',u.permissions.dispatch?'Yes':'No',u.permissions.reports?'Yes':'No',u.plantAccess||'']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(usersAoa), 'Users');

  const cfgAoa = [['Field','Value'],
    ['Company Name', STATE.company.name], ['GSTIN', STATE.company.gstin], ['State', STATE.company.state],
    ['State Code', STATE.company.stateCode], ['Registered Address', STATE.company.regdAddress],
    ['Consignor Address', STATE.company.consignorAddress], ['Production Unit', STATE.plants.productionUnit],
    [], ['RMC Plant','Delivery Address']
  ];
  STATE.plants.rmc.forEach(p=>cfgAoa.push([p, STATE.plants.addresses[p]||'']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cfgAoa), 'Company & Plants');

  XLSX.writeFile(wb, 'TCPL_Full_Backup_'+todayISO()+'.xlsx');
  showToast('Backup downloaded ✓');
}

async function saveNewRecipe(){
  const name = document.getElementById('nrName').value.trim();
  const prefix = document.getElementById('nrPrefix').value.trim().toUpperCase();
  const batchKg = parseFloat(document.getElementById('nrBatchKg').value)||0;
  const wastageKg = parseFloat(document.getElementById('nrWastage').value)||0;
  const waterKg = parseFloat(document.getElementById('nrWater').value)||0;
  const hsn = document.getElementById('nrHsn').value.trim()||'3906';
  const isPouch = document.getElementById('nrIsPouch').checked;
  const pouchWeightKg = isPouch ? (parseFloat(document.getElementById('nrPouchWeight').value)||0.25) : undefined;
  const packagingLabel = isPouch ? (document.getElementById('nrPackagingLabel').value.trim()||'Pouch') : undefined;
  if(!name||!prefix){ showToast('Product name and prefix are required'); return; }
  const ingredients = [];
  document.querySelectorAll('#nrIngredients .ing-row').forEach(row=>{
    const item = row.querySelector('.ing-item').value;
    const qty = parseFloat(row.querySelector('.ing-qty').value)||0;
    if(qty>0) ingredients.push({item, qty});
  });
  const newRecipe = {id:uid('r'), productName:name, prefix, hsn, batchKg, wastageKg, waterKg, ingredients};
  if(isPouch){ newRecipe.isPouch = true; newRecipe.pouchWeightKg = pouchWeightKg; newRecipe.packagingLabel = packagingLabel; }
  STATE.recipes.push(newRecipe);
  await saveConfig(); closeModal(); showToast('Recipe saved ✓'); setMastersTab('recipes');
}

  const parts = [];
  if(u.permissions.dashboard) parts.push('Dashboard');
  if(u.permissions.purchase) parts.push('Purchase');
  if(u.permissions.production) parts.push('Production');
  if(u.permissions.dispatch) parts.push('Dispatch');
  if(u.permissions.dailyConsumption) parts.push('Daily Consumption');
  if(u.permissions.reports) parts.push('Reports');
  if(u.plantAccess) parts.push('View: '+u.plantAccess);
  return parts.length ? parts.map(p=>`<span class="badge badge-ok" style="margin-right:4px;">${p}</span>`).join('') : '<span class="small-muted">No access</span>';
}
async function addUser(){
  const username = document.getElementById('newUserName').value.trim();
  const password = document.getElementById('newUserPass').value.trim();
  const name = document.getElementById('newUserFull').value.trim()||username;
  const isAdmin = document.getElementById('newUserAdmin').checked;
  if(!username||!password){ showToast('Username and password are required'); return; }
  if(STATE.users.find(u=>u.username.toLowerCase()===username.toLowerCase())){ showToast('This username already exists'); return; }
  const permissions = { dashboard:document.getElementById('permDashboard').checked, purchase:document.getElementById('permPurchase').checked, production:document.getElementById('permProduction').checked, dispatch:document.getElementById('permDispatch').checked, dailyConsumption:document.getElementById('permDailyConsumption').checked, reports:document.getElementById('permReports').checked, consolidatedReports:document.getElementById('permConsolidatedReports').checked };
  const plantAccess = document.getElementById('newUserPlant').value || null;
  STATE.users.push({username, password, name, isAdmin, permissions, plantAccess});
  await saveConfig(); showToast('User added ✓'); setMastersTab('users');
}
async function deleteUser(username){
  if(username==='admin'){ showToast('Admin user cannot be deleted'); return; }
  if(!confirm('Remove this user?')) return;
  STATE.users = STATE.users.filter(u=>u.username!==username);
  await saveConfig(); setMastersTab('users');
}

/* ================= MODAL ================= */
function openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalBg').classList.add('show'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }

/* ================= BOOT ================= */
window.addEventListener('error', function(e){
  const errEl = document.getElementById('loginError');
  if(errEl){
    errEl.style.display = 'block';
    errEl.textContent = 'App failed to start: ' + (e.message||'unknown error') + '. Please reload the page. If this keeps happening, try a different browser (Chrome/Edge) or check your internet connection.';
  }
});
(async function init(){
  try{
    // Randomize field names so the browser cannot correlate/offer previously
    // saved logins from other people who used this same file on this device.
    const rnd = Math.random().toString(36).slice(2,8);
    document.getElementById('loginUser').setAttribute('name','u_'+rnd);
    document.getElementById('loginPass').setAttribute('name','p_'+rnd);
    await loadState();
    document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') closeModal(); });
    document.getElementById('loginUser').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginPass').focus(); });
    document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  }catch(e){
    const errEl = document.getElementById('loginError');
    if(errEl){ errEl.style.display='block'; errEl.textContent = 'App failed to start: '+e.message+'. Please reload the page.'; }
    console.error(e);
  }
})();

const _origRenderPage2 = renderPage;
renderPage = function(){
  _origRenderPage2();
  if(ACTIVE_TAB==='purchase') renderPurchaseTable();
  if(ACTIVE_TAB==='production') renderProductionTable();
  if(ACTIVE_TAB==='dispatch'){ renderDispatchCart(); renderDispatchTable(); }
  if(ACTIVE_TAB==='dailyreport') renderDailyReport();
  if(ACTIVE_TAB==='reports') runReport();
  if(ACTIVE_TAB==='dashboard' && document.getElementById('dpMode')) onDpModeChange();
};
